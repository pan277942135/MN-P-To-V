openapi: 3.1.0
info:
  title: Zaojing Identity Safe Video API
  version: 1.3.0
  description: Read durable Zaojing character packages and create or monitor Identity Safe image-to-video tasks from ChatGPT.
servers:
  - url: https://zaojing-chatgpt-gateway-uat-REPLACE.run.app
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: healthCheck
      security: []
      summary: Check whether the Zaojing ChatGPT gateway is healthy.
      responses:
        '200':
          description: Healthy gateway.
  /v1/characters:
    get:
      operationId: listZaojingCharacters
      security: []
      summary: List durable character packages already stored in Zaojing.
      description: Use this before asking the user to upload a character pack. Optionally search by character id, name, or description. This is a read-only operation.
      x-openai-isConsequential: false
      parameters:
        - in: query
          name: q
          required: false
          schema:
            type: string
            maxLength: 120
          description: Optional character id or name such as meining or 梅凝.
      responses:
        '200':
          description: Action-safe character list. Inspect ok, status, count, characters, and any explicit registry error.
  /v1/characters/{characterId}:
    get:
      operationId: getZaojingCharacterPackage
      security: []
      summary: Get one durable Zaojing character package for generation planning.
      description: Returns identitySpec plus stable reference asset URLs from the existing Firestore and GCS character library. This does not create or modify a character.
      x-openai-isConsequential: false
      parameters:
        - in: path
          name: characterId
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 160
          description: Exact characterId returned by listZaojingCharacters.
      responses:
        '200':
          description: Action-safe role package or CHARACTER_NOT_FOUND result. Use rolePackage identitySpec and reference metadata as the durable source of truth.
  /v1/images/preflight:
    post:
      operationId: preflightIdentityImage
      security: []
      summary: Verify that one ChatGPT conversation image reaches Zaojing as valid image bytes.
      description: Validate one ChatGPT image reference without creating a task or calling Veo. Handled file-bridge failures return HTTP 200 with ok=false and diagnostics.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openaiFileIdRefs]
              properties:
                openaiFileIdRefs:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    type: string
                  description: Exactly one JPG, PNG or WebP uploaded by the user in this conversation.
      responses:
        '200':
          description: Action-safe preflight result. Inspect ok, status, error and diagnostics; no video task or Veo call is created.
  /v1/videos/resolve:
    post:
      operationId: resolveIdentitySafeVideoIntent
      security: []
      summary: Resolve a previous create intent from its stable idempotency key without creating or submitting a video.
      description: Call this immediately after any create client or transport error before retrying create. It only queries the durable idempotency index and never calls Veo.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotencyKey]
              properties:
                idempotencyKey:
                  type: string
                  minLength: 16
                  maxLength: 200
                  description: The exact stable idempotency key previously used for the create intent.
      responses:
        '200':
          description: Action-safe durable intent resolution. Returns the existing task when present, INTENT_NOT_FOUND when absent, or RESOLVE_FAILED when lookup is inconclusive.
  /v1/videos:
    post:
      operationId: createIdentitySafeVideo
      security: []
      summary: Create one Identity Safe video from a durable Zaojing character reference or one ChatGPT conversation image.
      description: Prefer character_reference when the user names a stored Zaojing character. Reuse one stable idempotencyKey per intent; resolve any transport error before retrying create.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt, durationSeconds, idempotencyKey]
              properties:
                prompt:
                  type: string
                  maxLength: 12000
                  description: Scene and motion prompt. For character_reference, Zaojing adds the durable identity lock before the provider call.
                durationSeconds:
                  type: integer
                  enum: [4, 6, 8]
                idempotencyKey:
                  type: string
                  minLength: 16
                  maxLength: 200
                  description: Stable random key for one user intent. Generate it once and reuse the exact same value on every recovery or retry of that intent.
                inputSource:
                  type: object
                  description: Durable input selector. Use character_reference for a Zaojing role; use conversation_file only when an explicit conversation image is intended.
                  properties:
                    type:
                      type: string
                      enum: [character_reference, conversation_file]
                    characterId:
                      type: string
                      maxLength: 160
                      description: Exact characterId returned by listZaojingCharacters. Required when type is character_reference.
                    referenceId:
                      type: string
                      maxLength: 160
                      description: Exact durable referenceId returned by getZaojingCharacterPackage. Required when type is character_reference.
                    openaiFileIdRef:
                      type: string
                      description: Optional single ChatGPT conversation image reference when type is conversation_file.
                openaiFileIdRefs:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    type: string
                  description: Legacy conversation-image input. Do not send this together with character_reference.
      responses:
        '200':
          description: Action-safe create or recovery result. Inspect taskId, inputSource, taskCreated, providerCalled, error, recoveredBy, inputFile and diagnostics.
        '429':
          description: UAT bounded direct-admission limit reached.
  /v1/videos/{taskId}:
    get:
      operationId: getIdentitySafeVideoTask
      security: []
      summary: Get current generation and Identity QA status for a task.
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Current task state including inputSource binding and verified videoUrl/downloadUrl when the artifact is ready. }
        '202': { description: Task is still running. }
        '404': { description: Task not found. }
  /v1/videos/{taskId}/stream:
    get:
      operationId: streamIdentitySafeVideo
      security: []
      summary: Stream or download one verified MP4 artifact without creating a new video task.
      description: Returns the persisted MP4 only after artifactPersisted and artifactVerified are true. Use download=1 for an attachment and Range for playback.
      x-openai-isConsequential: false
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: string }
        - in: query
          name: download
          required: false
          schema: { type: string, enum: ['1', 'true'] }
      responses:
        '200': { description: Verified MP4 video stream. content: video/mp4. }
        '206': { description: Partial MP4 response for byte-range playback. content: video/mp4. }
        '404': { description: Video artifact is not ready or task does not exist. }
  /v1/videos/{taskId}/recover:
    post:
      operationId: recoverIdentitySafeVideoArtifact
      security: []
      summary: Recover an already-generated provider artifact without submitting another Veo generation.
      description: Recover an existing provider artifact only. This operation must never create a new Veo attempt.
      x-openai-isConsequential: false
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Existing artifact recovered or task updated. }
        '404': { description: No recoverable artifact found. }
components:
  schemas: {}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
