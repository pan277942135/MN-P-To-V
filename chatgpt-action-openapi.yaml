openapi: 3.1.0
info:
  title: Zaojing Identity Safe Video API
  version: 1.0.0
  description: Create and monitor Zaojing Identity Safe image-to-video tasks from ChatGPT.
servers:
  - url: https://zaojing-chatgpt-gateway-uat-REPLACE.run.app
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: healthCheck
      security: []
      summary: Check whether the Zaojing ChatGPT gateway is healthy.
      responses:
        '200':
          description: Healthy gateway.
  /v1/images/preflight:
    post:
      operationId: preflightIdentityImage
      security: []
      summary: Verify that one ChatGPT conversation image reaches Zaojing as valid image bytes.
      description: Validate one ChatGPT image reference without creating a task or calling Veo. Handled file-bridge failures return HTTP 200 with ok=false and diagnostics.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openaiFileIdRefs]
              properties:
                openaiFileIdRefs:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    type: string
                  description: Exactly one JPG, PNG or WebP uploaded by the user in this conversation.
      responses:
        '200':
          description: Action-safe preflight result. Inspect ok, status, error and diagnostics; no video task or Veo call is created.
  /v1/videos/resolve:
    post:
      operationId: resolveIdentitySafeVideoIntent
      security: []
      summary: Resolve a previous create intent from its stable idempotency key without creating or submitting a video.
      description: Call this immediately after any create client or transport error before retrying create. It only queries the durable idempotency index and never calls Veo.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotencyKey]
              properties:
                idempotencyKey:
                  type: string
                  minLength: 16
                  maxLength: 200
                  description: The exact stable idempotency key previously used for the create intent.
      responses:
        '200':
          description: Action-safe durable intent resolution. Returns the existing task when present, INTENT_NOT_FOUND when absent, or RESOLVE_FAILED when lookup is inconclusive.
  /v1/videos:
    post:
      operationId: createIdentitySafeVideo
      security: []
      summary: Create one Identity Safe video from exactly one image in the ChatGPT conversation.
      description: UAT supports bounded direct calls. Generate one stable idempotencyKey per intent; if this action itself has a client/transport error, call resolveIdentitySafeVideoIntent before any create retry.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt, durationSeconds, idempotencyKey, openaiFileIdRefs]
              properties:
                prompt:
                  type: string
                  maxLength: 12000
                  description: Scene and motion prompt. Identity Safe automatically constrains risky motion.
                durationSeconds:
                  type: integer
                  enum: [4, 6, 8]
                idempotencyKey:
                  type: string
                  minLength: 16
                  maxLength: 200
                  description: Stable random key for one user intent. Generate it once and reuse the exact same value on every recovery or retry of that intent.
                openaiFileIdRefs:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    type: string
                  description: Exactly one JPG, PNG or WebP uploaded by the user in this conversation.
      responses:
        '200':
          description: Action-safe create or recovery result. Inspect taskId, taskCreated, providerCalled, error, recoveredBy, inputFile and diagnostics.
        '429':
          description: UAT bounded direct-admission limit reached.
  /v1/videos/{taskId}:
    get:
      operationId: getIdentitySafeVideoTask
      security: []
      summary: Get current generation and Identity QA status for a task.
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Current task state. }
        '202': { description: Task is still running. }
        '404': { description: Task not found. }
  /v1/videos/{taskId}/recover:
    post:
      operationId: recoverIdentitySafeVideoArtifact
      security: []
      summary: Recover an already-generated provider artifact without submitting another Veo generation.
      description: Recover an existing provider artifact only. This operation must never create a new Veo attempt.
      x-openai-isConsequential: false
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Existing artifact recovered or task updated. }
        '404': { description: No recoverable artifact found. }
components:
  schemas: {}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
