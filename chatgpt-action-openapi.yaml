openapi: 3.1.0
info:
  title: Zaojing Identity Safe Video API
  version: 1.0.0
  description: Create and monitor Zaojing Identity Safe image-to-video tasks from ChatGPT.
servers:
  - url: https://zaojing-chatgpt-gateway-uat-REPLACE.run.app
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: healthCheck
      security: []
      summary: Check whether the Zaojing ChatGPT gateway is healthy.
      responses:
        '200':
          description: Healthy gateway.
  /v1/images/preflight:
    post:
      operationId: preflightIdentityImage
      summary: Verify that one ChatGPT conversation image reaches Zaojing as valid image bytes.
      description: Validate one ChatGPT image reference without creating a task or calling Veo. Handled file-bridge failures return HTTP 200 with ok=false and diagnostics.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openaiFileIdRefs]
              properties:
                openaiFileIdRefs:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    type: string
                  description: Exactly one JPG, PNG or WebP uploaded by the user in this conversation.
      responses:
        '200':
          description: Action-safe preflight result. Inspect ok, status, error and diagnostics; no video task or Veo call is created.
        '401':
          description: Invalid API key.
  /v1/videos:
    post:
      operationId: createIdentitySafeVideo
      summary: Create one Identity Safe video from exactly one image in the ChatGPT conversation.
      description: Create an Identity Safe video from one uploaded image. Handled request, file-bridge and upstream outcomes return HTTP 200 so ChatGPT can inspect taskId and diagnostics safely.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt, durationSeconds, openaiFileIdRefs]
              properties:
                prompt:
                  type: string
                  maxLength: 12000
                  description: Scene and motion prompt. Identity Safe automatically constrains risky motion.
                durationSeconds:
                  type: integer
                  enum: [4, 6, 8]
                idempotencyKey:
                  type: string
                  description: Stable key for safely retrying the same create request after a transport failure. Reuse the same value for the same user intent.
                openaiFileIdRefs:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    type: string
                  description: Exactly one JPG, PNG or WebP uploaded by the user in this conversation.
      responses:
        '200':
          description: Action-safe create result. Inspect ok, status, taskId, taskCreated, providerCalled, error, inputFile and upstreamHttpStatus.
        '401':
          description: Invalid API key.
  /v1/videos/{taskId}:
    get:
      operationId: getIdentitySafeVideoTask
      summary: Get current generation and Identity QA status for a task.
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Current task state. }
        '202': { description: Task is still running. }
        '401': { description: Invalid API key. }
        '404': { description: Task not found. }
  /v1/videos/{taskId}/recover:
    post:
      operationId: recoverIdentitySafeVideoArtifact
      summary: Recover an already-generated provider artifact without submitting another Veo generation.
      description: Recover an existing provider artifact only. This operation must never create a new Veo attempt.
      x-openai-isConsequential: false
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Existing artifact recovered or task updated. }
        '401': { description: Invalid API key. }
        '404': { description: No recoverable artifact found. }
components:
  schemas: {}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer