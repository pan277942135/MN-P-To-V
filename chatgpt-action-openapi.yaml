openapi: 3.1.0
info:
  title: Zaojing Identity Safe Image + Video API
  version: 1.4.1
  description: Read durable Zaojing character packages and master images for ChatGPT image editing, and create, monitor, and retrieve Identity Safe image-to-video artifacts.
servers:
  - url: https://zaojing-chatgpt-gateway-uat-REPLACE.run.app
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: healthCheck
      security: []
      summary: Check whether the Zaojing ChatGPT gateway is healthy.
      responses:
        '200':
          description: Healthy gateway.
  /v1/characters:
    get:
      operationId: listZaojingCharacters
      security: []
      summary: List durable character packages already stored in Zaojing.
      description: Use this before asking the user to upload a character pack. Optionally search by character id, name, or description. This is a read-only operation.
      x-openai-isConsequential: false
      parameters:
        - in: query
          name: q
          required: false
          schema:
            type: string
            maxLength: 120
          description: Optional character id or name such as meining or 梅凝.
      responses:
        '200':
          description: Action-safe character list. Inspect ok, status, count, characters, and any explicit registry error.
  /v1/characters/{characterId}:
    get:
      operationId: getZaojingCharacterPackage
      security: []
      summary: Get one durable Zaojing character package for generation planning.
      description: Returns identitySpec, reference asset URLs, and editContract. Bind only the current user upload as source, use references as identity inputs, invoke ChatGPT native image editing, and reject unchanged output. Zaojing never generates final images.
      x-openai-isConsequential: false
      parameters:
        - in: path
          name: characterId
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 160
          description: Exact characterId returned by listZaojingCharacters.
      responses:
        '200':
          description: Action-safe role package or CHARACTER_NOT_FOUND result. Use rolePackage identitySpec and reference metadata as the durable source of truth.
  /v1/images/preflight:
    post:
      operationId: preflightIdentityImage
      security: []
      summary: Verify that one ChatGPT conversation image reaches Zaojing as valid image bytes.
      description: Validate one ChatGPT image reference without creating a task or calling a generation model. Handled file-bridge failures return HTTP 200 with ok=false and diagnostics.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openaiFileIdRefs]
              properties:
                openaiFileIdRefs:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    type: string
                  description: Exactly one JPG, PNG or WebP uploaded by the user in this conversation.
      responses:
        '200':
          description: Action-safe preflight result. Inspect ok, status, error and diagnostics; no generation task is created.
  /v1/videos/resolve:
    post:
      operationId: resolveIdentitySafeVideoIntent
      security: []
      summary: Resolve a previous create intent from its stable idempotency key without creating or submitting a video.
      description: Call this immediately after any create client or transport error before retrying create. It only queries the durable idempotency index and never calls Veo.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotencyKey]
              properties:
                idempotencyKey:
                  type: string
                  minLength: 16
                  maxLength: 200
                  description: The exact stable idempotency key previously used for the create intent.
      responses:
        '200':
          description: Action-safe durable intent resolution. Returns the existing task when present, INTENT_NOT_FOUND when absent, or RESOLVE_FAILED when lookup is inconclusive.
  /v1/videos:
    post:
      operationId: createIdentitySafeVideo
      security: []
      summary: Create one Identity Safe video from exactly one image in the ChatGPT conversation.
      description: UAT supports bounded direct calls. Generate one stable idempotencyKey per intent; if this action itself has a client/transport error, call resolveIdentitySafeVideoIntent before any create retry.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt, durationSeconds, idempotencyKey, openaiFileIdRefs]
              properties:
                prompt:
                  type: string
                  maxLength: 12000
                  description: Scene and motion prompt. Identity Safe automatically constrains risky motion.
                durationSeconds:
                  type: integer
                  enum: [4, 6, 8]
                idempotencyKey:
                  type: string
                  minLength: 16
                  maxLength: 200
                  description: Stable random key for one user intent. Generate it once and reuse the exact same value on every recovery or retry of that intent.
                openaiFileIdRefs:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    type: string
                  description: Exactly one JPG, PNG or WebP uploaded by the user in this conversation.
      responses:
        '200':
          description: Action-safe create or recovery result. Inspect taskId, taskCreated, providerCalled, error, recoveredBy, inputFile and diagnostics.
        '429':
          description: UAT bounded direct-admission limit reached.
  /v1/videos/{taskId}:
    get:
      operationId: getIdentitySafeVideoTask
      security: []
      summary: Get current generation and Identity QA status for a task.
      description: When status is COMPLETED and videoReady is true, call getIdentitySafeVideoArtifact to obtain temporary HTTPS playback and download URLs.
      x-openai-isConsequential: false
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Current task state. }
        '202': { description: Task is still running. }
        '404': { description: Task not found. }
  /v1/videos/{taskId}/artifact:
    get:
      operationId: getIdentitySafeVideoArtifact
      security: []
      summary: Get temporary HTTPS playback and download URLs for a completed Identity Safe video.
      description: Call only after COMPLETED. Uses native GCS V4 Signed URLs when available, otherwise an expiring Gateway capability URL; internal gs:// locations are never exposed.
      x-openai-isConsequential: false
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        '200':
          description: Verified artifact is ready; use videoUrl for playback and downloadUrl for direct download before expiresAt.
        '404': { description: Task or persisted artifact not found. }
        '409': { description: Task or verified artifact is not ready. }
        '503': { description: Temporary artifact access could not be issued; retry this read-only action without regenerating the video. }
  /v1/videos/{taskId}/recover:
    post:
      operationId: recoverIdentitySafeVideoArtifact
      security: []
      summary: Recover an already-generated provider artifact without submitting another Veo generation.
      description: Recover an existing provider artifact only. This operation must never create a new Veo attempt.
      x-openai-isConsequential: false
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Existing artifact recovered or task updated. }
        '404': { description: No recoverable artifact found. }
components:
  schemas: {}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
