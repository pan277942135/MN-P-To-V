name: Provider Admission Cutover

on:
  push:
    branches:
      - core-provider-admission
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    env:
      VEO_OUTPUT_BUCKET: ai-studio-bucket-89614354864-asia-south1
      NODE_ENV: test
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: core-provider-admission
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Apply provider admission migration
        run: node scripts/apply_provider_admission_patch.mjs

      - name: TypeScript gate
        run: npm run lint

      - name: Full regression suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Diff integrity
        run: git diff --check

      - name: Persist verified migration
        run: |
          if git diff --quiet -- server.ts src/server/repositories/firestoreTaskRepository.ts src/server/services/taskStateMachineService.ts; then
            echo "Provider admission migration already persisted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/server/repositories/firestoreTaskRepository.ts src/server/services/taskStateMachineService.ts
          git commit -m "feat: enforce durable provider admission and ambiguous-submit safety"
          git push origin HEAD:core-provider-admission
