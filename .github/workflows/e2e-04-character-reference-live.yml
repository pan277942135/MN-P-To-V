name: E2E-04 Character Reference Live Acceptance

on:
  push:
    branches: [e2e-04-character-reference-final]
    paths:
      - 'chatgpt-gateway.ts'
      - 'chatgpt-character-router.ts'
      - 'chatgpt-action-openapi.yaml'
      - 'src/server/services/chatgptCharacterInputResolver.ts'
      - 'src/__tests__/chatgptGatewayContract.test.ts'
      - '.github/workflows/e2e-04-character-reference-live.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

env:
  PROJECT_ID: xp-vertex-project
  REGION: us-central1
  GAR_REPO: zaojing
  GATEWAY_SERVICE: zaojing-chatgpt-gateway-uat
  CHATGPT_UPSTREAM_SERVICE: zaojing-chatgpt-upstream-uat
  WIF_PROVIDER: projects/89614354864/locations/global/workloadIdentityPools/github-actions-mnptov/providers/repo
  DEPLOY_SA: github-deployer@xp-vertex-project.iam.gserviceaccount.com
  RUNTIME_SA: zaojing-video-runtime@xp-vertex-project.iam.gserviceaccount.com
  FIRESTORE_DATABASE_ID: ai-studio-0806-1d34279b-010b-4a28-8239-d080392dee29
  BOOTSTRAP_KEY_HASH: 2eb32be8da4af88e0d9dc19b8fa642977394a7021e91ca24e61ea667417f44f2
  UAT_DIRECT_DAILY_LIMIT: '12'

jobs:
  live-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Run gateway contract tests
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bunx vitest run src/__tests__/chatgptGatewayContract.test.ts

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
          create_credentials_file: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Resolve existing private upstream
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "$CHATGPT_UPSTREAM_SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Build and push E2E-04 gateway image
        id: gateway_image
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          SHA="$(git rev-parse HEAD)"
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPO/$GATEWAY_SERVICE:e2e04-$SHA"
          docker build -f Dockerfile.chatgpt-gateway -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Deploy E2E-04 gateway to bounded UAT
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$GATEWAY_SERVICE" \
            --project="$PROJECT_ID" --region="$REGION" --platform=managed \
            --image='${{ steps.gateway_image.outputs.image }}' \
            --service-account="$RUNTIME_SA" \
            --allow-unauthenticated --no-iap \
            --cpu=1 --memory=1Gi --timeout=300 --concurrency=20 --min-instances=0 --max-instances=2 \
            --set-env-vars="NODE_ENV=production,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,FIRESTORE_DATABASE_ID=$FIRESTORE_DATABASE_ID,RUNTIME_SERVICE_ACCOUNT_EMAIL=$RUNTIME_SA,ZAOJING_MVP_UPSTREAM_URL=${{ steps.upstream.outputs.url }},ZAOJING_UPSTREAM_AUTH_MODE=cloud-run-id-token,ZAOJING_CHATGPT_BOOTSTRAP_KEY_HASH=$BOOTSTRAP_KEY_HASH,ZAOJING_CHATGPT_UAT_DIRECT=true,ZAOJING_CHATGPT_UAT_DAILY_LIMIT=$UAT_DIRECT_DAILY_LIMIT" \
            --quiet
          URL="$(gcloud run services describe "$GATEWAY_SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          REV="$(gcloud run services describe "$GATEWAY_SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.latestReadyRevisionName)')"
          gcloud run services update "$GATEWAY_SERVICE" --project="$PROJECT_ID" --region="$REGION" \
            --update-env-vars="ZAOJING_CHATGPT_PUBLIC_URL=$URL" --quiet >/dev/null
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "revision=$REV" >> "$GITHUB_OUTPUT"

      - name: Run live Mei Ning character-reference generation
        id: live
        shell: bash
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          echo health > live-stage.txt
          curl -fsS "$URL/health" -o health.json
          jq -e '.status == "ok" and .upstreamReachable == true and .uatDirectMode == true' health.json >/dev/null

          echo openapi > live-stage.txt
          curl -fsS "$URL/openapi.yaml" -o openapi.yaml
          grep -q 'character_reference' openapi.yaml
          grep -q 'required: \[prompt, durationSeconds, idempotencyKey\]' openapi.yaml

          echo characters > live-stage.txt
          curl -fsS --get --data-urlencode 'q=梅凝' "$URL/v1/characters" -o characters.json
          jq -e '.ok == true and .count >= 1' characters.json >/dev/null
          CHARACTER_ID="$(jq -r '.characters[0].characterId' characters.json)"
          test -n "$CHARACTER_ID" && test "$CHARACTER_ID" != 'null'
          echo "character_id=$CHARACTER_ID" >> "$GITHUB_OUTPUT"

          echo package > live-stage.txt
          curl -fsS "$URL/v1/characters/$CHARACTER_ID" -o character-package.json
          jq -e '.ok == true and .rolePackage.characterId == $id and .rolePackage.referenceCount >= 1' --arg id "$CHARACTER_ID" character-package.json >/dev/null
          REFERENCE_ID="$(jq -r '[.rolePackage.references[] | select(.angle == "front")][0].referenceId // .rolePackage.references[0].referenceId' character-package.json)"
          test -n "$REFERENCE_ID" && test "$REFERENCE_ID" != 'null'
          echo "reference_id=$REFERENCE_ID" >> "$GITHUB_OUTPUT"

          echo reference-bytes > live-stage.txt
          curl -fsS -D reference-headers.txt "$URL/v1/characters/$CHARACTER_ID/references/$REFERENCE_ID" -o reference.bin
          grep -qi '^content-type: image/png' reference-headers.txt
          grep -qi '^x-zaojing-mime-authority: magic-bytes' reference-headers.txt
          grep -qi '^x-zaojing-metadata-mime-mismatch: true' reference-headers.txt
          python3 - <<'PY'
          from pathlib import Path
          data = Path('reference.bin').read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n', data[:16]
          print({'referenceBytes': len(data), 'pngMagicVerified': True})
          PY

          IDEMPOTENCY_KEY="e2e04-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-meining"
          echo "idempotency_key=$IDEMPOTENCY_KEY" >> "$GITHUB_OUTPUT"
          jq -nc \
            --arg prompt 'Keep the adult character identity stable. Near-locked camera, natural breathing, one subtle blink, minimal hair movement, no reframing.' \
            --arg idem "$IDEMPOTENCY_KEY" \
            --arg cid "$CHARACTER_ID" \
            --arg rid "$REFERENCE_ID" \
            '{prompt:$prompt,durationSeconds:4,idempotencyKey:$idem,inputSource:{type:"character_reference",characterId:$cid,referenceId:$rid}}' > create-request.json

          echo create > live-stage.txt
          CREATE_HTTP="$(curl -sS -o create.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data-binary @create-request.json "$URL/v1/videos")"
          test "$CREATE_HTTP" = '200'
          cat create.json
          jq -e '.taskCreated == true and .taskId != null and .inputSource.type == "character_reference" and .inputSource.characterId == $cid and .inputSource.referenceId == $rid' --arg cid "$CHARACTER_ID" --arg rid "$REFERENCE_ID" create.json >/dev/null
          jq -e '.inputFile.detectedMime == "image/png" and .inputFile.metadataMimeMismatch == true and .inputFile.mimeAuthority == "magic_bytes"' create.json >/dev/null
          TASK_ID="$(jq -r '.taskId' create.json)"
          test -n "$TASK_ID" && test "$TASK_ID" != 'null'
          echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"

          cp create.json final.json
          echo poll > live-stage.txt
          for i in $(seq 1 45); do
            STATUS="$(jq -r '.status // ""' final.json)"
            if [ "$STATUS" = 'COMPLETED' ] || [ "$STATUS" = 'FAILED' ] || [ "$STATUS" = 'SUBMISSION_OUTCOME_UNKNOWN' ]; then
              break
            fi
            sleep 12
            curl -fsS "$URL/v1/videos/$TASK_ID" -o final.json
            echo "[poll $i] $(jq -c '{status,stage,providerAttempt,identityRetryCount,artifactPersisted,artifactVerified,sizeBytes,identityReport,inputSource,error}' final.json)"
          done

          echo assertions > live-stage.txt
          jq -e '.status == "COMPLETED"' final.json >/dev/null
          jq -e '.inputSource.type == "character_reference" and .inputSource.characterId == $cid and .inputSource.referenceId == $rid' --arg cid "$CHARACTER_ID" --arg rid "$REFERENCE_ID" final.json >/dev/null
          jq -e '.artifactPersisted == true and .artifactVerified == true and .sizeBytes >= 1000 and .videoReady == true' final.json >/dev/null
          jq -e '.identityReport.pass == true and .identityReport.gateStatus == "pass"' final.json >/dev/null

          echo "size_bytes=$(jq -r '.sizeBytes' final.json)" >> "$GITHUB_OUTPUT"
          echo "identity_gate=$(jq -r '.identityReport.gateStatus' final.json)" >> "$GITHUB_OUTPUT"
          echo "provider_attempt=$(jq -r '.providerAttempt' final.json)" >> "$GITHUB_OUTPUT"
          echo "identity_retry_count=$(jq -r '.identityRetryCount' final.json)" >> "$GITHUB_OUTPUT"
          echo done > live-stage.txt

      - name: Verify canonical GCS MP4 bytes
        id: artifact
        shell: bash
        env:
          TASK_ID: ${{ steps.live.outputs.task_id }}
          VEO_OUTPUT_BUCKET: ai-studio-bucket-89614354864-asia-south1
        run: |
          set -euo pipefail
          OBJECT="gs://$VEO_OUTPUT_BUCKET/veo/$TASK_ID/video.mp4"
          echo "object=$OBJECT" >> "$GITHUB_OUTPUT"
          gcloud storage cp "$OBJECT" final.mp4
          test "$(stat -c%s final.mp4)" -ge 1000
          python3 - <<'PY'
          from pathlib import Path
          data = Path('final.mp4').read_bytes()
          assert len(data) >= 1000, len(data)
          assert b'ftyp' in data[:64], data[:64]
          print({'mp4Bytes': len(data), 'ftypVerified': True})
          PY
          echo "mp4_bytes=$(stat -c%s final.mp4)" >> "$GITHUB_OUTPUT"

      - name: Record E2E-04 live evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GATEWAY_URL: ${{ steps.deploy.outputs.url }}
          GATEWAY_REVISION: ${{ steps.deploy.outputs.revision }}
          CHARACTER_ID: ${{ steps.live.outputs.character_id }}
          REFERENCE_ID: ${{ steps.live.outputs.reference_id }}
          TASK_ID: ${{ steps.live.outputs.task_id }}
          IDEMPOTENCY_KEY: ${{ steps.live.outputs.idempotency_key }}
          SIZE_BYTES: ${{ steps.live.outputs.size_bytes }}
          IDENTITY_GATE: ${{ steps.live.outputs.identity_gate }}
          PROVIDER_ATTEMPT: ${{ steps.live.outputs.provider_attempt }}
          IDENTITY_RETRY_COUNT: ${{ steps.live.outputs.identity_retry_count }}
          MP4_OBJECT: ${{ steps.artifact.outputs.object }}
          MP4_BYTES: ${{ steps.artifact.outputs.mp4_bytes }}
        run: |
          set -euo pipefail
          STATUS='${{ job.status }}'
          STAGE="$(cat live-stage.txt 2>/dev/null || echo before-live)"
          HEALTH_BODY="$(cat health.json 2>/dev/null || echo unavailable)"
          CHARACTERS_BODY="$(cat characters.json 2>/dev/null || echo unavailable)"
          PACKAGE_BODY="$(cat character-package.json 2>/dev/null || echo unavailable)"
          REFERENCE_HEADERS="$(cat reference-headers.txt 2>/dev/null || echo unavailable)"
          CREATE_BODY="$(cat create.json 2>/dev/null || echo unavailable)"
          FINAL_BODY="$(cat final.json 2>/dev/null || echo unavailable)"
          BODY=$(cat <<EOF
          ### E2E-04 character_reference live acceptance
          - Job status: \`$STATUS\`
          - Source SHA: \`${GITHUB_SHA}\`
          - Last live stage: \`$STAGE\`
          - Gateway URL: ${GATEWAY_URL:-unknown}
          - Gateway revision: \`${GATEWAY_REVISION:-unknown}\`
          - Character: \`${CHARACTER_ID:-unknown}\`
          - Reference: \`${REFERENCE_ID:-unknown}\`
          - Task: \`${TASK_ID:-unknown}\`
          - Idempotency key: \`${IDEMPOTENCY_KEY:-unknown}\`
          - Input source: \`character_reference\`
          - User re-uploaded master image: \`false\`
          - Task video size: \`${SIZE_BYTES:-unknown}\`
          - Canonical GCS MP4: \`${MP4_OBJECT:-unknown}\`
          - Canonical MP4 bytes: \`${MP4_BYTES:-unknown}\`
          - Identity QA gate: \`${IDENTITY_GATE:-unknown}\`
          - Provider attempt: \`${PROVIDER_ATTEMPT:-unknown}\`
          - Identity retry count: \`${IDENTITY_RETRY_COUNT:-unknown}\`

          Reference response headers:
          \`\`\`text
          $REFERENCE_HEADERS
          \`\`\`

          Create response:
          \`\`\`json
          $CREATE_BODY
          \`\`\`

          Final task body:
          \`\`\`json
          $FINAL_BODY
          \`\`\`

          Health body:
          \`\`\`json
          $HEALTH_BODY
          \`\`\`

          Characters body:
          \`\`\`json
          $CHARACTERS_BODY
          \`\`\`

          Character package body:
          \`\`\`json
          $PACKAGE_BODY
          \`\`\`
          EOF
          )
          jq -nc --arg body "$BODY" '{body:$body}' > issue-comment.json
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/47/comments" \
            --data-binary @issue-comment.json >/dev/null
