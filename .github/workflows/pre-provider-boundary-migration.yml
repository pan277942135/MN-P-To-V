name: Pre-Provider Durability Boundary Cutover

on:
  push:
    branches:
      - core-pre-provider-durability-boundary
  workflow_dispatch:

permissions:
  contents: write

jobs:
  persist-verified-product-tree:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      VEO_OUTPUT_BUCKET: ai-studio-bucket-89614354864-asia-south1
      NODE_ENV: test
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: core-pre-provider-durability-boundary
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Apply final safety assertions
        run: node scripts/finalize_pre_provider_boundary.mjs

      - name: Remove temporary non-workflow tooling
        run: |
          rm -f \
            .pre-provider-patch-error.txt \
            package-lock.json \
            scripts/apply_pre_provider_boundary_patch.mjs \
            scripts/finalize_pre_provider_boundary.mjs \
            scripts/fix_pre_provider_patch_syntax.mjs \
            scripts/refine_pre_provider_boundary_tests.mjs \
            scripts/refine_pre_provider_route_integration_test.mjs \
            scripts/refine_pre_provider_types.mjs

      - name: TypeScript gate on final product tree
        run: npm run lint

      - name: Full regression suite on final product tree
        run: npm test

      - name: Production build on final product tree
        run: npm run build

      - name: Diff integrity
        run: git diff --check

      - name: Persist verified product tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: lock pre-provider fail-closed authorization invariants"
          git push origin HEAD:core-pre-provider-durability-boundary
