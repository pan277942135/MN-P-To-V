name: M2 UAT RAI Safety Semantics

on:
  push:
    branches:
      - m2-uat-rai-safety-semantics

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: m2-uat-rai-safety-semantics
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Apply deterministic RAI semantics patch
        run: python3 scripts/apply-m2-uat-rai-safety-semantics.py

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Focused RAI regression
        run: bun test src/__tests__/m2UatRaiSafetySemantics.test.ts

      - name: TypeScript
        run: bunx tsc --noEmit

      - name: Full regression
        run: bun test

      - name: Production build
        run: bun run build

      - name: Persist patched source when needed
        shell: bash
        run: |
          set -euo pipefail
          git add server.ts src/utils/taskHelper.ts src/__tests__/m2UatRaiSafetySemantics.test.ts
          if git diff --cached --quiet; then
            echo 'No source changes to commit; branch already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(M2 UAT): correct RAI filter semantics and retry UX'
          git push origin HEAD:m2-uat-rai-safety-semantics
