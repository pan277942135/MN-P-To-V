name: Diagnose Cloud Run Veo Failure

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: xp-vertex-project
  REGION: us-central1
  SERVICE: zaojing-m2-uat
  WIF_PROVIDER: projects/89614354864/locations/global/workloadIdentityPools/github-actions-mnptov/providers/repo
  DIAG_SA: github-deployer@xp-vertex-project.iam.gserviceaccount.com
  SINCE: '2026-08-17T06:45:00Z'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DIAG_SA }}
          create_credentials_file: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Temporarily grant Logging Viewer
        id: grant_logging
        shell: bash
        continue-on-error: true
        run: |
          set +e
          echo '=== TEMP IAM GRANT: roles/logging.viewer ==='
          OUT="$(gcloud projects add-iam-policy-binding "$PROJECT_ID" \
            --member="serviceAccount:$DIAG_SA" \
            --role="roles/logging.viewer" \
            --condition=None \
            --quiet 2>&1)"
          RC=$?
          printf '%s\n' "$OUT"
          if [ "$RC" -eq 0 ]; then
            echo 'granted=true' >> "$GITHUB_OUTPUT"
            echo 'Temporary logging.viewer grant succeeded.'
            sleep 8
          else
            echo 'granted=false' >> "$GITHUB_OUTPUT"
            echo "Temporary logging.viewer grant failed with rc=$RC."
          fi
          exit "$RC"

      - name: Resolve private UAT service URL
        id: service
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          REVISION="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.latestReadyRevisionName)')"
          echo "service_url=$SERVICE_URL" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "UAT revision: $REVISION"

      - name: Mint authenticated Cloud Run ID token
        uses: google-github-actions/auth@v3
        id: invoke_auth
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DIAG_SA }}
          token_format: id_token
          id_token_audience: ${{ steps.service.outputs.service_url }}
          id_token_include_email: true

      - name: Read recent durable task diagnostics through UAT API
        shell: bash
        env:
          SERVICE_URL: ${{ steps.service.outputs.service_url }}
          ID_TOKEN: ${{ steps.invoke_auth.outputs.id_token }}
        run: |
          set -euo pipefail
          echo '=== DURABLE TASK DIAGNOSTICS: newest first ==='
          curl -fsS -H "Authorization: Bearer $ID_TOKEN" "$SERVICE_URL/api/videos/list?limit=40" \
            | jq '{storageAuthority, tasks: [.tasks[] | {taskId, createdAt, updatedAt, status, failureReason, retryMode, externalOperationName, settings, error}]}'

      - name: Read recent Cloud Run application logs
        shell: bash
        run: |
          set +e
          echo "=== APP LOGS: since $SINCE, newest first ==="
          gcloud logging read \
            "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"$SERVICE\" AND timestamp>=\"$SINCE\"" \
            --project="$PROJECT_ID" \
            --limit=500 \
            --order=desc \
            --format='table(timestamp,severity,resource.labels.revision_name,textPayload,jsonPayload.message,jsonPayload.error,jsonPayload.status,jsonPayload.httpStatus,jsonPayload.upstreamHttpStatus,jsonPayload.failureReason,jsonPayload.googleStatus,jsonPayload.retryMode,trace)'

      - name: Read likely Veo and retry lines
        shell: bash
        run: |
          set +e
          echo '=== FILTERED VEO / RETRY / RATE / FAILURE LINES ==='
          gcloud logging read \
            "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"$SERVICE\" AND timestamp>=\"$SINCE\" AND (textPayload:\"Rate exceeded\" OR textPayload:\"RESOURCE_EXHAUSTED\" OR textPayload:\"[Retry]\" OR textPayload:\"retry\" OR textPayload:\"Veo\" OR textPayload:\"Video Start\" OR textPayload:\"generation_failed\" OR jsonPayload.message:\"Rate exceeded\" OR jsonPayload.message:\"RESOURCE_EXHAUSTED\" OR jsonPayload.googleStatus=\"RESOURCE_EXHAUSTED\")" \
            --project="$PROJECT_ID" \
            --limit=300 \
            --order=asc \
            --format='value(timestamp,severity,resource.labels.revision_name,textPayload,jsonPayload.message,jsonPayload.error,jsonPayload.status,jsonPayload.httpStatus,jsonPayload.upstreamHttpStatus,jsonPayload.failureReason,jsonPayload.googleStatus,jsonPayload.retryMode,trace)'

      - name: Read HTTP request failures
        shell: bash
        run: |
          set +e
          echo '=== CLOUD RUN REQUESTS status>=400 ==='
          gcloud logging read \
            "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"$SERVICE\" AND timestamp>=\"$SINCE\" AND httpRequest.status>=400" \
            --project="$PROJECT_ID" \
            --limit=200 \
            --order=asc \
            --format='table(timestamp,resource.labels.revision_name,httpRequest.requestMethod,httpRequest.requestUrl,httpRequest.status,httpRequest.latency,trace)'

      - name: Revoke temporary Logging Viewer
        if: always() && steps.grant_logging.outputs.granted == 'true'
        shell: bash
        run: |
          set +e
          echo '=== TEMP IAM REVOKE: roles/logging.viewer ==='
          gcloud projects remove-iam-policy-binding "$PROJECT_ID" \
            --member="serviceAccount:$DIAG_SA" \
            --role="roles/logging.viewer" \
            --condition=None \
            --quiet
          echo 'Temporary logging.viewer grant removed.'
