name: ChatGPT Gateway UAT Deploy

on:
  push:
    branches: [main]
    paths:
      - 'chatgpt-gateway.ts'
      - 'chatgpt-action-openapi.yaml'
      - 'Dockerfile.chatgpt-gateway'
      - 'Dockerfile.mvp'
      - 'mvp-server-v021.ts'
      - 'mvp-server-v02.ts'
      - 'src/mvp/**'
      - 'src/__tests__/chatgptGatewayContract.test.ts'
      - '.github/workflows/chatgpt-gateway-uat-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

env:
  PROJECT_ID: xp-vertex-project
  REGION: us-central1
  GAR_REPO: zaojing
  GATEWAY_SERVICE: zaojing-chatgpt-gateway-uat
  CHATGPT_UPSTREAM_SERVICE: zaojing-chatgpt-upstream-uat
  WIF_PROVIDER: projects/89614354864/locations/global/workloadIdentityPools/github-actions-mnptov/providers/repo
  DEPLOY_SA: github-deployer@xp-vertex-project.iam.gserviceaccount.com
  RUNTIME_SA: zaojing-video-runtime@xp-vertex-project.iam.gserviceaccount.com
  VEO_OUTPUT_BUCKET: ai-studio-bucket-89614354864-asia-south1
  FIRESTORE_DATABASE_ID: ai-studio-0806-1d34279b-010b-4a28-8239-d080392dee29
  VEO_MODEL_ID: veo-3.1-fast-generate-001
  IDENTITY_QA_MODEL: gemini-2.5-flash
  BOOTSTRAP_KEY_HASH: 2eb32be8da4af88e0d9dc19b8fa642977394a7021e91ca24e61ea667417f44f2

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - id: checkout
        uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
          create_credentials_file: true
      - id: setup
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Artifact Registry auth
        shell: bash
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build and push private Identity Safe upstream image
        id: upstream_image
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPO/$CHATGPT_UPSTREAM_SERVICE:$SHA"
          docker build -f Dockerfile.mvp -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Deploy private Cloud Run upstream for ChatGPT
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$CHATGPT_UPSTREAM_SERVICE" \
            --project="$PROJECT_ID" --region="$REGION" --platform=managed \
            --image='${{ steps.upstream_image.outputs.image }}' \
            --service-account="$RUNTIME_SA" \
            --no-allow-unauthenticated --no-iap \
            --cpu=2 --memory=3Gi --timeout=900 --concurrency=4 --min-instances=0 --max-instances=2 \
            --set-env-vars="NODE_ENV=production,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,VERTEX_LOCATION=$REGION,VEO_OUTPUT_BUCKET=$VEO_OUTPUT_BUCKET,FIRESTORE_DATABASE_ID=$FIRESTORE_DATABASE_ID,VEO_MODEL_ID=$VEO_MODEL_ID,IDENTITY_QA_MODEL=$IDENTITY_QA_MODEL,RUNTIME_SERVICE_ACCOUNT_EMAIL=$RUNTIME_SA,COMMIT_SHA=${{ steps.upstream_image.outputs.source_sha }}" \
            --quiet
          gcloud run services add-iam-policy-binding "$CHATGPT_UPSTREAM_SERVICE" \
            --project="$PROJECT_ID" --region="$REGION" \
            --member="serviceAccount:$RUNTIME_SA" \
            --role="roles/run.invoker" --quiet >/dev/null
          URL="$(gcloud run services describe "$CHATGPT_UPSTREAM_SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          REV="$(gcloud run services describe "$CHATGPT_UPSTREAM_SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.latestReadyRevisionName)')"
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "revision=$REV" >> "$GITHUB_OUTPUT"

      - name: Build and push gateway image
        id: gateway_image
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPO/$GATEWAY_SERVICE:$SHA"
          docker build -f Dockerfile.chatgpt-gateway -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy public API-key gateway
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$GATEWAY_SERVICE" \
            --project="$PROJECT_ID" --region="$REGION" --platform=managed \
            --image='${{ steps.gateway_image.outputs.image }}' \
            --service-account="$RUNTIME_SA" \
            --allow-unauthenticated --no-iap \
            --cpu=1 --memory=1Gi --timeout=120 --concurrency=20 --min-instances=0 --max-instances=2 \
            --set-env-vars="NODE_ENV=production,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,FIRESTORE_DATABASE_ID=$FIRESTORE_DATABASE_ID,RUNTIME_SERVICE_ACCOUNT_EMAIL=$RUNTIME_SA,ZAOJING_MVP_UPSTREAM_URL=${{ steps.upstream.outputs.url }},ZAOJING_UPSTREAM_AUTH_MODE=cloud-run-id-token,ZAOJING_CHATGPT_BOOTSTRAP_KEY_HASH=$BOOTSTRAP_KEY_HASH" \
            --quiet
          URL="$(gcloud run services describe "$GATEWAY_SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          REV="$(gcloud run services describe "$GATEWAY_SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.latestReadyRevisionName)')"
          gcloud run services update "$GATEWAY_SERVICE" --project="$PROJECT_ID" --region="$REGION" \
            --update-env-vars="ZAOJING_CHATGPT_PUBLIC_URL=$URL" --quiet >/dev/null
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "revision=$REV" >> "$GITHUB_OUTPUT"

      - name: Verify gateway, upstream auth, OpenAPI, and Bearer boundary
        id: verify
        shell: bash
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          curl -fsS "$URL/health" | tee health.json
          grep -q '"status":"ok"' health.json
          grep -q 'zaojing-chatgpt-gateway' health.json
          grep -q '"upstreamAuthMode":"cloud-run-id-token"' health.json
          grep -q '"upstreamReachable":true' health.json
          grep -q '"bootstrapKeyConfigured":true' health.json
          curl -fsS "$URL/openapi.yaml" | tee openapi.yaml
          grep -q "$URL" openapi.yaml
          grep -q 'openaiFileIdRefs' openapi.yaml
          STATUS="$(curl -sS -o unauthorized.json -w '%{http_code}' "$URL/v1/videos/test-task")"
          test "$STATUS" = '401'

      - name: Record deployment evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          REVISION: ${{ steps.deploy.outputs.revision }}
          UPSTREAM_URL: ${{ steps.upstream.outputs.url }}
          UPSTREAM_REVISION: ${{ steps.upstream.outputs.revision }}
        run: |
          set -euo pipefail
          STATUS='${{ job.status }}'
          BODY=$(cat <<EOF
          ### ChatGPT Gateway UAT deployment evidence
          - Job status: \`$STATUS\`
          - Source SHA: \`${GITHUB_SHA}\`
          - Gateway service: \`$GATEWAY_SERVICE\`
          - Gateway revision: \`${REVISION:-unknown}\`
          - Gateway URL: ${URL:-unknown}
          - OpenAPI: ${URL:-unknown}/openapi.yaml
          - Private upstream service: \`$CHATGPT_UPSTREAM_SERVICE\`
          - Private upstream revision: \`${UPSTREAM_REVISION:-unknown}\`
          - Private upstream URL: ${UPSTREAM_URL:-unknown}
          - Upstream auth: \`Cloud Run IAM ID token\`
          - Bootstrap API-key hash configured: \`true\`
          - Step outcomes: checkout=\`${{ steps.checkout.outcome }}\`, auth=\`${{ steps.auth.outcome }}\`, setup=\`${{ steps.setup.outcome }}\`, upstream_image=\`${{ steps.upstream_image.outcome }}\`, upstream=\`${{ steps.upstream.outcome }}\`, gateway_image=\`${{ steps.gateway_image.outcome }}\`, deploy=\`${{ steps.deploy.outcome }}\`, verify=\`${{ steps.verify.outcome }}\`
          - Verification: gateway health includes reachable authenticated upstream, generated OpenAPI points at gateway, unauthenticated \`/v1/* -> 401\`.
          EOF
          )
          jq -nc --arg body "$BODY" '{body:$body}' > comment.json
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/47/comments" \
            --data-binary @comment.json >/dev/null

      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo '## Zaojing ChatGPT Actions Gateway UAT ready'
            echo "- Gateway: ${{ steps.deploy.outputs.url }}"
            echo "- Revision: ${{ steps.deploy.outputs.revision }}"
            echo "- OpenAPI: ${{ steps.deploy.outputs.url }}/openapi.yaml"
            echo "- Private upstream: ${{ steps.upstream.outputs.url }}"
            echo "- Upstream revision: ${{ steps.upstream.outputs.revision }}"
            echo '- Upstream auth: Cloud Run IAM ID token from the gateway service identity.'
            echo '- Public routes: /health and /openapi.yaml only; /v1/* requires a hashed revocable Bearer key.'
          } >> "$GITHUB_STEP_SUMMARY"
