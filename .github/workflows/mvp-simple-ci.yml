name: MVP Simple CI

on:
  push:
    branches:
      - agent/mvp-simple-verifiable
      - agent/mvp-simple-verifiable-v2
      - agent/identity-safe-v02
      - agent/mvp-network-deadline-hardening
  pull_request:
    paths:
      - 'mvp-server.ts'
      - 'mvp-server-v02.ts'
      - 'mvp-server-v021.ts'
      - 'identity-benchmark-runner.ts'
      - 'Dockerfile.mvp'
      - 'src/mvp/**'
      - 'src/__tests__/autoAspectRatio.test.ts'
      - 'src/__tests__/mvpProviderAutoAspect.contract.test.ts'
      - 'src/__tests__/mvpSimpleContract.test.ts'
      - 'src/__tests__/mvpIdentitySafe.test.ts'
      - 'src/__tests__/mvpNetworkDeadlineHardening.test.ts'
      - '.github/workflows/mvp-simple-*.yml'
      - '.github/workflows/identity-safe-real-benchmark.yml'
      - '.github/identity-safe-benchmark-v02.trigger'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run lint

      - name: MVP v0.1 contract tests
        run: bunx vitest run src/__tests__/mvpSimpleContract.test.ts

      - name: Identity Safe v0.2 tests and 24-case benchmark contract
        run: bunx vitest run src/__tests__/mvpIdentitySafe.test.ts

      - name: AUTO aspect ratio tests
        run: bunx vitest run src/__tests__/autoAspectRatio.test.ts src/__tests__/mvpProviderAutoAspect.contract.test.ts

      - name: Network/deadline hardening tests
        run: bunx vitest run src/__tests__/mvpNetworkDeadlineHardening.test.ts

      - name: Existing regression suite
        env:
          VEO_OUTPUT_BUCKET: ai-studio-bucket-89614354864-asia-south1
        run: bun run test

      - name: Build standalone Identity Safe v0.2.1 server
        run: |
          bunx esbuild mvp-server-v021.ts \
            --bundle \
            --platform=node \
            --format=cjs \
            --packages=external \
            --sourcemap \
            --outfile=dist/mvp-server.cjs

      - name: Build standalone real benchmark runner
        run: |
          bunx esbuild identity-benchmark-runner.ts \
            --bundle \
            --platform=node \
            --format=cjs \
            --packages=external \
            --sourcemap \
            --outfile=dist/identity-benchmark-runner.cjs
          test -s dist/identity-benchmark-runner.cjs

      - name: Build MVP Cloud Run image
        run: docker build -f Dockerfile.mvp -t zaojing-mvp-simple:ci .

      - name: Container smoke
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker run -d \
            -e PORT=8080 \
            -e VEO_OUTPUT_BUCKET=ai-studio-bucket-89614354864-asia-south1 \
            -e GOOGLE_CLOUD_PROJECT=xp-vertex-project \
            -e VERTEX_LOCATION=us-central1 \
            -e IDENTITY_QA_MODEL=gemini-2.5-flash \
            -p 18080:8080 zaojing-mvp-simple:ci)"
          cleanup() { docker rm -f "$cid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/mvp/health >/tmp/mvp-health.json; then
              cat /tmp/mvp-health.json
              grep -q 'MVP_IDENTITY_SAFE_V02' /tmp/mvp-health.json
              curl -fsS http://127.0.0.1:18080/api/mvp/client-health >/tmp/mvp-client-health.json
              grep -q 'identity-safe-v0.2.1-network-hardening' /tmp/mvp-client-health.json
              grep -q '"networkRecovery":true' /tmp/mvp-client-health.json
              curl -fsS http://127.0.0.1:18080/ >/tmp/mvp-index.html
              grep -q 'Identity Safe v0.2.1' /tmp/mvp-index.html
              grep -q 'NETWORK_RECOVERING' /tmp/mvp-index.html
              grep -q '/api/mvp/videos/lookup' /tmp/mvp-index.html
              curl -fsS http://127.0.0.1:18080/api/mvp/benchmark/catalog >/tmp/mvp-benchmark.json
              grep -q 'IDSAFE-24' /tmp/mvp-benchmark.json
              docker exec "$cid" test -s /app/dist/identity-benchmark-runner.cjs
              exit 0
            fi
            sleep 1
          done
          docker logs "$cid" || true
          exit 1
