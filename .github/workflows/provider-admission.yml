name: Provider Admission Safety

on:
  workflow_dispatch:
  push:
    branches:
      - core-provider-admission
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  provider-admission:
    runs-on: ubuntu-latest
    env:
      VEO_OUTPUT_BUCKET: ai-studio-bucket-89614354864-asia-south1
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provider admission contract gate
        run: |
          grep -q "providerAdmissionCollectionName = 'video_provider_admission'" src/server/repositories/firestoreTaskRepository.ts
          grep -q "Atomic cross-instance admission boundary" src/server/repositories/firestoreTaskRepository.ts
          grep -q "PROVIDER_ADMISSION_BUSY" server.ts
          grep -q "provider_admission_busy" server.ts
          grep -q "predictLongRunningCalls: 0" server.ts
          grep -q "submission_outcome_unknown" server.ts
          grep -q "const isAmbiguousSubmitFailure" server.ts
          grep -q "const isKnownOperationTimedOut = Boolean(rec.operationName)" server.ts
          grep -q "submitting: \['submitted', 'preparing', 'generating', 'submission_outcome_unknown'" src/server/services/taskStateMachineService.ts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: TypeScript gate
        run: npm run lint

      - name: Full regression suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Diff integrity
        run: git diff --check
