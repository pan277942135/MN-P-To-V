name: Deploy Advisory Identity QA UAT Once

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-advisory-qa-uat-once.yml'

permissions:
  contents: read
  id-token: write

env:
  SOURCE_SHA: 5323f1cd97c770699dfa29e637afe7cfe5bdfecc
  PROJECT_ID: xp-vertex-project
  REGION: us-central1
  GAR_REPO: zaojing
  SERVICE: zaojing-m2-uat
  WIF_PROVIDER: projects/89614354864/locations/global/workloadIdentityPools/github-actions-mnptov/providers/repo
  DEPLOY_SA: github-deployer@xp-vertex-project.iam.gserviceaccount.com
  RUNTIME_SA: zaojing-video-runtime@xp-vertex-project.iam.gserviceaccount.com
  VEO_OUTPUT_BUCKET: ai-studio-bucket-89614354864-asia-south1
  VEO_MODEL_ID: veo-3.1-fast-generate-001
  FIRESTORE_DATABASE_ID: ai-studio-0806-1d34279b-010b-4a28-8239-d080392dee29

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact accepted main source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
          create_credentials_file: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Build and push immutable image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPO/$SERVICE:$SOURCE_SHA"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy stable private IAP UAT
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --platform=managed \
            --image='${{ steps.image.outputs.image }}' \
            --service-account="$RUNTIME_SA" \
            --no-allow-unauthenticated \
            --iap \
            --cpu=1 \
            --memory=2Gi \
            --timeout=900 \
            --concurrency=8 \
            --min-instances=0 \
            --max-instances=4 \
            --set-env-vars="NODE_ENV=production,VEO_OUTPUT_BUCKET=$VEO_OUTPUT_BUCKET,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,VERTEX_LOCATION=$REGION,VEO_MODEL_ID=$VEO_MODEL_ID,RUNTIME_SERVICE_ACCOUNT_EMAIL=$RUNTIME_SA,FIRESTORE_DATABASE_ID=$FIRESTORE_DATABASE_ID,FIRST_FRAME_IDENTITY_QA_BLOCKING=false" \
            --quiet

          REVISION="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.latestReadyRevisionName)')"
          URL="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Verify deployed revision policy
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_YAML="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format=yaml)"
          printf '%s\n' "$SERVICE_YAML" > /tmp/service.yaml
          grep -q "run.googleapis.com/iap-enabled: 'true'" /tmp/service.yaml
          REVISION='${{ steps.deploy.outputs.revision }}'
          ENV_VALUE="$(gcloud run revisions describe "$REVISION" --project="$PROJECT_ID" --region="$REGION" --format='value(spec.containers[0].env[?name=FIRST_FRAME_IDENTITY_QA_BLOCKING].value)')"
          test "$ENV_VALUE" = 'false'
          READY="$(gcloud run revisions describe "$REVISION" --project="$PROJECT_ID" --region="$REGION" --format='value(status.conditions[?type=Ready].status)')"
          test "$READY" = 'True'
          echo "revision=$REVISION"
          echo "first_frame_identity_qa_blocking=$ENV_VALUE"
          echo "url=${{ steps.deploy.outputs.url }}"
