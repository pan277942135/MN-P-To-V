name: Verify Advisory Identity QA UAT Once

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-advisory-qa-uat-once.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: xp-vertex-project
  REGION: us-central1
  SERVICE: zaojing-m2-uat
  EXPECTED_REVISION: zaojing-m2-uat-00021-467
  WIF_PROVIDER: projects/89614354864/locations/global/workloadIdentityPools/github-actions-mnptov/providers/repo
  DEPLOY_SA: github-deployer@xp-vertex-project.iam.gserviceaccount.com

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
          create_credentials_file: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify deployed revision policy
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE" \
            --project="$PROJECT_ID" --region="$REGION" --format=json > /tmp/service.json
          gcloud run revisions describe "$EXPECTED_REVISION" \
            --project="$PROJECT_ID" --region="$REGION" --format=json > /tmp/revision.json

          python3 - <<'PY'
          import json
          service=json.load(open('/tmp/service.json'))
          revision=json.load(open('/tmp/revision.json'))

          annotations=(service.get('metadata') or {}).get('annotations') or {}
          latest=((service.get('status') or {}).get('latestReadyRevisionName'))
          url=((service.get('status') or {}).get('url'))
          iap=annotations.get('run.googleapis.com/iap-enabled')

          envs=((revision.get('spec') or {}).get('containers') or [{}])[0].get('env') or []
          env={item.get('name'):item.get('value') for item in envs}
          qa_blocking=env.get('FIRST_FRAME_IDENTITY_QA_BLOCKING')

          conditions=(revision.get('status') or {}).get('conditions') or []
          ready=next((c.get('status') for c in conditions if c.get('type')=='Ready'), None)

          print('latest_revision=', latest)
          print('iap_enabled=', iap)
          print('first_frame_identity_qa_blocking=', qa_blocking)
          print('ready=', ready)
          print('url=', url)

          assert latest == 'zaojing-m2-uat-00021-467', (latest, 'unexpected latest revision')
          assert str(iap).lower() == 'true', (iap, 'IAP not enabled')
          assert qa_blocking == 'false', (qa_blocking, 'QA blocking policy not disabled')
          assert str(ready).lower() == 'true', (ready, 'revision not ready')
          PY
