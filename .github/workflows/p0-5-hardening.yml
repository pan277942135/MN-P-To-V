name: P0-5 Hardening

on:
  push:
    branches:
      - p0-5-real-e2e-hardening

permissions:
  contents: write

env:
  VEO_OUTPUT_BUCKET: ai-studio-bucket-89614354864-asia-south1

jobs:
  harden-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply deterministic P0-5 server hardening
        shell: bash
        run: |
          if grep -q "P0-5: Provider submission is part of the request durability boundary" server.ts; then
            echo "P0-5 server hardening already applied."
          else
            python3 scripts/apply-p0-5-server-hardening.py
          fi
          if [ -f scripts/apply-p0-5-test-hardening.py ]; then
            python3 scripts/apply-p0-5-test-hardening.py
          fi
          if [ -f scripts/apply-p0-5-contract-fixture-fix.py ]; then
            python3 scripts/apply-p0-5-contract-fixture-fix.py
          fi

      - name: Diff check
        run: git diff --check

      - name: Typecheck
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Commit verified hardening
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts \
            src/__tests__/firestoreTaskRepository.test.ts \
            src/__tests__/apiVideoStartRouteIntegration.test.ts \
            src/__tests__/p0DurableStateMachine.test.ts \
            src/__tests__/p0StorageAuthorityRegression.test.ts
          git commit -m "ci(p0-5): apply verified hardening"
          git push origin HEAD:p0-5-real-e2e-hardening
