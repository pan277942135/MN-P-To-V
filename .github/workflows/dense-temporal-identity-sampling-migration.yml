name: Dense Temporal Identity Sampling Cutover

on:
  push:
    branches:
      - core-dense-temporal-identity-sampling
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      VEO_OUTPUT_BUCKET: ai-studio-bucket-89614354864-asia-south1
      NODE_ENV: test
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: core-dense-temporal-identity-sampling
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Apply dense temporal identity sampling patch
        run: |
          node scripts/apply_dense_temporal_identity_sampling_patch.mjs
          node scripts/refine_dense_sampling_test_fixtures.mjs

      - name: TypeScript gate
        run: npm run lint

      - name: Full regression suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Diff integrity
        run: git diff --check

      - name: Persist verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/services/video/videoInspector.ts \
            src/services/qa/videoIdentityQaService.ts \
            src/server/services/durableVideoIdentityQaService.ts \
            src/__tests__/m22VideoIdentityQa.test.ts \
            src/__tests__/m23FailureDiagnosis.test.ts \
            src/__tests__/m24VideoRetryPolicy.test.ts \
            src/__tests__/denseTemporalIdentitySamplingSourceContract.test.ts
          if git diff --cached --quiet; then
            echo "No product changes to persist"
          else
            git commit -m "feat: densify temporal sampling for video identity QA"
            git push origin HEAD:core-dense-temporal-identity-sampling
          fi
