name: P0-5 Live Resume Certification

on:
  push:
    branches:
      - p0-5-real-e2e-hardening
    paths:
      - .github/workflows/p0-5-live-resume.yml

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: xp-vertex-project
  PROJECT_NUMBER: '89614354864'
  REGION: us-central1
  GAR_REPO: zaojing
  SERVICE: zaojing-p0-5-staging
  WIF_PROVIDER: projects/89614354864/locations/global/workloadIdentityPools/github-actions-mnptov/providers/repo
  DEPLOY_SA: github-deployer@xp-vertex-project.iam.gserviceaccount.com
  RUNTIME_SA: zaojing-video-runtime@xp-vertex-project.iam.gserviceaccount.com
  VEO_OUTPUT_BUCKET: ai-studio-bucket-89614354864-asia-south1
  VEO_MODEL_ID: veo-3.1-fast-generate-001
  FIRESTORE_DATABASE_ID: ai-studio-0806-1d34279b-010b-4a28-8239-d080392dee29
  TASK_ID: p05live_cert_v1
  EXPECTED_OPERATION_NAME: projects/xp-vertex-project/locations/us-central1/publishers/google/models/veo-3.1-fast-generate-001/operations/61e3d25c-4081-46f8-aac2-bfa2b0ccde16

jobs:
  resume-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout fixed branch
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via WIF
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
          create_credentials_file: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify federated identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')" = "$PROJECT_NUMBER"
          gcloud auth list --filter=status:ACTIVE --format='value(account)'

      - name: Build and push fixed staging image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPO/$SERVICE:$GITHUB_SHA"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy fixed private Cloud Run revision
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --platform=managed \
            --image='${{ steps.image.outputs.image }}' \
            --service-account="$RUNTIME_SA" \
            --no-allow-unauthenticated \
            --cpu=1 \
            --memory=2Gi \
            --timeout=900 \
            --concurrency=1 \
            --min-instances=0 \
            --max-instances=3 \
            --set-env-vars="NODE_ENV=production,VEO_OUTPUT_BUCKET=$VEO_OUTPUT_BUCKET,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,VERTEX_LOCATION=$REGION,VEO_MODEL_ID=$VEO_MODEL_ID,RUNTIME_SERVICE_ACCOUNT_EMAIL=$RUNTIME_SA,FIRESTORE_DATABASE_ID=$FIRESTORE_DATABASE_ID" \
            --quiet

          gcloud run services add-iam-policy-binding "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --member="serviceAccount:$DEPLOY_SA" \
            --role="roles/run.invoker" \
            --quiet >/dev/null

          SERVICE_URL="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          REVISION="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.latestReadyRevisionName)')"
          test -n "$SERVICE_URL"
          test -n "$REVISION"
          echo "service_url=$SERVICE_URL" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$SERVICE_URL" > service-url.txt
          printf '%s\n' "$REVISION" > revision-before.txt

      - name: Mint invocation token for fixed revision
        id: idtoken1
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
          token_format: id_token
          id_token_audience: ${{ steps.deploy.outputs.service_url }}
          id_token_include_email: true

      - name: Prove existing operation is durable without polling it
        id: durable
        shell: bash
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.service_url }}
          ID_TOKEN: ${{ steps.idtoken1.outputs.id_token }}
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $ID_TOKEN"
          curl -fsS -H "$AUTH" "$SERVICE_URL/api/health" | tee health.json
          curl -fsS -H "$AUTH" "$SERVICE_URL/api/system/environment" | tee environment-before.json
          curl -fsS -H "$AUTH" "$SERVICE_URL/api/videos/audit" | tee audit-before-resume.json

          test "$(jq -r '.environment' environment-before.json)" = "cloud_run"
          test "$(jq -r '.storageAuthority' audit-before-resume.json)" = "firestore"
          test "$(jq -r '.artifactAuthority' audit-before-resume.json)" = "cloud_storage"

          TASK_STATUS="$(jq -r --arg t "$TASK_ID" '.tasks[]? | select(.taskId==$t) | .status' audit-before-resume.json | head -1)"
          OP_PRESENT="$(jq -r --arg t "$TASK_ID" '.tasks[]? | select(.taskId==$t) | .operationNamePresent' audit-before-resume.json | head -1)"
          test -n "$TASK_STATUS"
          test "$TASK_STATUS" != "failed"
          if [ "$TASK_STATUS" != "completed" ]; then
            test "$OP_PRESENT" = "true"
          fi
          echo "task_status=$TASK_STATUS" >> "$GITHUB_OUTPUT"

      - name: Concurrent duplicate starts must reuse the existing operation
        id: reuse
        shell: bash
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.service_url }}
          ID_TOKEN: ${{ steps.idtoken1.outputs.id_token }}
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $ID_TOKEN"

          do_reuse() {
            local out="$1"
            local codefile="$2"
            curl -sS -o "$out" -w '%{http_code}' \
              -H "$AUTH" \
              -X POST "$SERVICE_URL/api/videos/start" \
              -F "taskId=$TASK_ID" > "$codefile"
          }

          do_reuse duplicate-a.json duplicate-a.code &
          PID_A=$!
          do_reuse duplicate-b.json duplicate-b.code &
          PID_B=$!
          wait "$PID_A"
          wait "$PID_B"

          echo '--- duplicate A ---'; cat duplicate-a.json; echo
          echo '--- duplicate B ---'; cat duplicate-b.json; echo
          test "$(cat duplicate-a.code)" = "200"
          test "$(cat duplicate-b.code)" = "200"
          test "$(jq -r '.accepted' duplicate-a.json)" = "true"
          test "$(jq -r '.accepted' duplicate-b.json)" = "true"
          test "$(jq -r '.isIdempotentReuse' duplicate-a.json)" = "true"
          test "$(jq -r '.isIdempotentReuse' duplicate-b.json)" = "true"

          OP_A="$(jq -r '.operationName // empty' duplicate-a.json)"
          OP_B="$(jq -r '.operationName // empty' duplicate-b.json)"
          test "$OP_A" = "$EXPECTED_OPERATION_NAME"
          test "$OP_B" = "$EXPECTED_OPERATION_NAME"
          test "$OP_A" = "$OP_B"

          curl -fsS -H "$AUTH" "$SERVICE_URL/api/videos/audit" | tee audit-after-reuse.json
          TASK_STATUS="$(jq -r --arg t "$TASK_ID" '.tasks[]? | select(.taskId==$t) | .status' audit-after-reuse.json | head -1)"
          OP_PRESENT="$(jq -r --arg t "$TASK_ID" '.tasks[]? | select(.taskId==$t) | .operationNamePresent' audit-after-reuse.json | head -1)"
          test -n "$TASK_STATUS"
          test "$TASK_STATUS" != "failed"
          if [ "$TASK_STATUS" != "completed" ]; then
            test "$OP_PRESENT" = "true"
          fi
          echo "pre_restart_status=$TASK_STATUS" >> "$GITHUB_OUTPUT"

      - name: Force a new Cloud Run revision before first status poll
        id: restart
        shell: bash
        run: |
          set -euo pipefail
          OLD_REVISION='${{ steps.deploy.outputs.revision }}'
          MARKER="resume-cert-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gcloud run services update "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --update-env-vars="P0_CERT_RESTART=$MARKER" \
            --quiet
          NEW_REVISION="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.latestReadyRevisionName)')"
          test -n "$NEW_REVISION"
          test "$NEW_REVISION" != "$OLD_REVISION"
          echo "old_revision=$OLD_REVISION" >> "$GITHUB_OUTPUT"
          echo "new_revision=$NEW_REVISION" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$NEW_REVISION" > revision-after.txt

      - name: Mint fresh token for new revision
        id: idtoken2
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
          token_format: id_token
          id_token_audience: ${{ steps.deploy.outputs.service_url }}
          id_token_include_email: true

      - name: New revision resumes the persisted Veo operation
        id: poll
        shell: bash
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.service_url }}
          ID_TOKEN: ${{ steps.idtoken2.outputs.id_token }}
          NEW_REVISION: ${{ steps.restart.outputs.new_revision }}
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $ID_TOKEN"
          curl -fsS -H "$AUTH" "$SERVICE_URL/api/system/environment" | tee environment-after-restart.json
          test "$(jq -r '.K_REVISION' environment-after-restart.json)" = "$NEW_REVISION"

          completed=0
          for i in $(seq 1 48); do
            HTTP_CODE="$(curl -sS -o status-current.json -w '%{http_code}' -H "$AUTH" "$SERVICE_URL/api/videos/status/$TASK_ID")"
            echo "poll=$i http=$HTTP_CODE $(jq -c '{status,error,failureReason,retryMode,sizeBytes}' status-current.json 2>/dev/null || cat status-current.json)"
            if [ "$HTTP_CODE" != "200" ]; then
              cp status-current.json status-failure.json
              exit 1
            fi
            STATUS="$(jq -r '.status // empty' status-current.json)"
            if [ "$STATUS" = "completed" ]; then
              cp status-current.json status-final.json
              completed=1
              break
            fi
            if [ "$STATUS" = "failed" ] || [ "$STATUS" = "artifact_persist_failed" ]; then
              cp status-current.json status-failure.json
              exit 1
            fi
            sleep 10
          done
          test "$completed" -eq 1

          curl -fsS -H "$AUTH" "$SERVICE_URL/api/videos/audit" | tee audit-final.json
          OUTPUT_BUCKET="$(jq -r --arg t "$TASK_ID" '.tasks[]? | select(.taskId==$t) | .outputBucket' audit-final.json | head -1)"
          OUTPUT_OBJECT="$(jq -r --arg t "$TASK_ID" '.tasks[]? | select(.taskId==$t) | .outputObjectPath' audit-final.json | head -1)"
          ARTIFACT_PERSISTED="$(jq -r --arg t "$TASK_ID" '.tasks[]? | select(.taskId==$t) | .artifactPersisted' audit-final.json | head -1)"
          test "$ARTIFACT_PERSISTED" = "true"
          test "$OUTPUT_BUCKET" = "$VEO_OUTPUT_BUCKET"
          test -n "$OUTPUT_OBJECT"
          test "$OUTPUT_OBJECT" != "null"
          echo "output_bucket=$OUTPUT_BUCKET" >> "$GITHUB_OUTPUT"
          echo "output_object=$OUTPUT_OBJECT" >> "$GITHUB_OUTPUT"

      - name: Validate authoritative GCS MP4 with ffprobe
        shell: bash
        env:
          OUTPUT_BUCKET: ${{ steps.poll.outputs.output_bucket }}
          OUTPUT_OBJECT: ${{ steps.poll.outputs.output_object }}
        run: |
          set -euo pipefail
          gcloud storage cp "gs://$OUTPUT_BUCKET/$OUTPUT_OBJECT" artifact-gcs.mp4
          test -s artifact-gcs.mp4
          test "$(stat -c '%s' artifact-gcs.mp4)" -gt 1024
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffprobe -v error -show_streams -show_format -of json artifact-gcs.mp4 | tee ffprobe-gcs.json
          test "$(jq '[.streams[] | select(.codec_type=="video")] | length' ffprobe-gcs.json)" -ge 1
          DURATION="$(jq -r '.format.duration // "0"' ffprobe-gcs.json)"
          python3 - "$DURATION" <<'PY'
          import sys
          d=float(sys.argv[1])
          assert d > 0.1, d
          PY
          sha256sum artifact-gcs.mp4 | tee sha256-gcs.txt

      - name: Mint token for stream equality check
        id: idtoken3
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
          token_format: id_token
          id_token_audience: ${{ steps.deploy.outputs.service_url }}
          id_token_include_email: true

      - name: Verify Cloud Run stream equals GCS byte-for-byte
        shell: bash
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.service_url }}
          ID_TOKEN: ${{ steps.idtoken3.outputs.id_token }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $ID_TOKEN" "$SERVICE_URL/api/videos/stream/$TASK_ID" -o artifact-stream.mp4
          test -s artifact-stream.mp4
          sha256sum artifact-stream.mp4 | tee sha256-stream.txt
          GCS_SHA="$(awk '{print $1}' sha256-gcs.txt)"
          STREAM_SHA="$(awk '{print $1}' sha256-stream.txt)"
          echo "gcs_sha256=$GCS_SHA"
          echo "stream_sha256=$STREAM_SHA"
          test "$GCS_SHA" = "$STREAM_SHA"
          ffprobe -v error -show_entries format=duration,size,format_name -of json artifact-stream.mp4 | tee ffprobe-stream.json

      - name: Build certification report
        if: always()
        shell: bash
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.service_url }}
          OLD_REVISION: ${{ steps.restart.outputs.old_revision }}
          NEW_REVISION: ${{ steps.restart.outputs.new_revision }}
          PRE_RESTART_STATUS: ${{ steps.reuse.outputs.pre_restart_status }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          def read_json(name):
              p=Path(name)
              if not p.exists(): return None
              try: return json.loads(p.read_text())
              except Exception: return {'raw': p.read_text(errors='replace')[:8000]}

          def sha(name):
              p=Path(name)
              if not p.exists(): return None
              return p.read_text().split()[0]

          report={
            'gate':'P0-5 live resume certification',
            'githubSha':os.environ.get('GITHUB_SHA'),
            'githubRunId':os.environ.get('GITHUB_RUN_ID'),
            'serviceUrl':os.environ.get('SERVICE_URL'),
            'taskId':os.environ.get('TASK_ID'),
            'expectedOperationName':os.environ.get('EXPECTED_OPERATION_NAME'),
            'preRestartStatus':os.environ.get('PRE_RESTART_STATUS'),
            'oldRevision':os.environ.get('OLD_REVISION'),
            'newRevision':os.environ.get('NEW_REVISION'),
            'environmentBefore':read_json('environment-before.json'),
            'auditBeforeResume':read_json('audit-before-resume.json'),
            'duplicateA':read_json('duplicate-a.json'),
            'duplicateB':read_json('duplicate-b.json'),
            'environmentAfterRestart':read_json('environment-after-restart.json'),
            'statusFinal':read_json('status-final.json'),
            'auditFinal':read_json('audit-final.json'),
            'ffprobeGcs':read_json('ffprobe-gcs.json'),
            'ffprobeStream':read_json('ffprobe-stream.json'),
            'gcsSha256':sha('sha256-gcs.txt'),
            'streamSha256':sha('sha256-stream.txt'),
          }
          Path('p0-5-resume-certification-report.json').write_text(json.dumps(report, indent=2, ensure_ascii=False))
          print(json.dumps(report, indent=2, ensure_ascii=False)[:16000])
          PY

      - name: Upload resume evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-5-live-resume-evidence-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            p0-5-resume-certification-report.json
            service-url.txt
            revision-before.txt
            revision-after.txt
            health.json
            environment-before.json
            environment-after-restart.json
            audit-before-resume.json
            audit-after-reuse.json
            audit-final.json
            duplicate-a.json
            duplicate-b.json
            status-final.json
            status-failure.json
            artifact-gcs.mp4
            artifact-stream.mp4
            ffprobe-gcs.json
            ffprobe-stream.json
            sha256-gcs.txt
            sha256-stream.txt

      - name: Return staging to zero-idle-cost settings
        if: always()
        shell: bash
        run: |
          gcloud run services update "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --min-instances=0 \
            --max-instances=1 \
            --concurrency=10 \
            --quiet || true

      - name: Final P0-5 certification verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s duplicate-a.json
          test -s duplicate-b.json
          test "$(jq -r '.isIdempotentReuse' duplicate-a.json)" = "true"
          test "$(jq -r '.isIdempotentReuse' duplicate-b.json)" = "true"
          test "$(jq -r '.operationName' duplicate-a.json)" = "$EXPECTED_OPERATION_NAME"
          test "$(jq -r '.operationName' duplicate-b.json)" = "$EXPECTED_OPERATION_NAME"
          test -s revision-before.txt
          test -s revision-after.txt
          test "$(cat revision-before.txt)" != "$(cat revision-after.txt)"
          test -s environment-after-restart.json
          test "$(jq -r '.K_REVISION' environment-after-restart.json)" = "$(cat revision-after.txt)"
          test -s status-final.json
          test "$(jq -r '.status' status-final.json)" = "completed"
          test -s audit-final.json
          test "$(jq -r --arg t "$TASK_ID" '.tasks[]? | select(.taskId==$t) | .artifactPersisted' audit-final.json | head -1)" = "true"
          test -s ffprobe-gcs.json
          test "$(jq '[.streams[] | select(.codec_type=="video")] | length' ffprobe-gcs.json)" -ge 1
          test -s sha256-gcs.txt
          test -s sha256-stream.txt
          test "$(awk '{print $1}' sha256-gcs.txt)" = "$(awk '{print $1}' sha256-stream.txt)"
          echo 'P0_5_LIVE_CERTIFICATION_PASS'
