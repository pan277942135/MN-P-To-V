name: ChatGPT Preflight Smoke

on:
  push:
    branches: [main]
    paths:
      - 'chatgpt-gateway.ts'
      - 'chatgpt-action-openapi.yaml'
      - '.github/workflows/chatgpt-preflight-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GATEWAY_URL: https://zaojing-chatgpt-gateway-uat-i7lns3auvq-uc.a.run.app
    steps:
      - name: Verify unauthenticated preflight reaches action-safe handler
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl -sS -o preflight.json -w '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            --data '{"openaiFileIdRefs":["file-smoke-diagnostic"]}' \
            "$GATEWAY_URL/v1/images/preflight")"
          cat preflight.json
          test "$STATUS" = '200'
          jq -e '
            .ok == false and
            .status == "FILE_BRIDGE_FAILED" and
            .error == "OPENAI_FILE_URL_INVALID" and
            .stage == "action_file_bridge" and
            .taskCreated == false and
            .providerCalled == false and
            .diagnostics.referenceKind == "string_file_id"
          ' preflight.json >/dev/null

      - name: Verify bounded direct UAT create reaches action-safe handler without Bearer
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl -sS -o direct.json -w '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            --data '{"prompt":"uat smoke","durationSeconds":4,"idempotencyKey":"uat-direct-smoke-00000001","openaiFileIdRefs":[]}' \
            "$GATEWAY_URL/v1/videos")"
          cat direct.json
          test "$STATUS" = '200'
          jq -e '
            .ok == false and
            .status == "REQUEST_REJECTED" and
            .error == "exactly_one_image_required" and
            .taskCreated == false and
            .providerCalled == false
          ' direct.json >/dev/null
