name: GCS Unknown Recovery Cutover

on:
  push:
    branches:
      - core-gcs-unknown-recovery
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      VEO_OUTPUT_BUCKET: ai-studio-bucket-89614354864-asia-south1
      NODE_ENV: test
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: core-gcs-unknown-recovery
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Apply GCS unknown recovery patch
        run: node scripts/apply_gcs_unknown_recovery_patch.mjs

      - name: TypeScript gate
        run: npm run lint

      - name: Full regression suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Diff integrity
        run: git diff --check

      - name: Persist verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            server.ts \
            src/server/storage/gcsArtifactStore.ts \
            src/server/services/taskStateMachineService.ts \
            src/components/ProviderOperationRecoveryCard.tsx \
            src/__tests__/gcsUnknownRecovery.test.ts \
            src/__tests__/gcsUnknownRecoverySourceContract.test.ts
          if git diff --cached --quiet; then
            echo "No product changes to persist"
          else
            git commit -m "feat: recover unknown Veo submissions from task-specific GCS evidence"
            git push origin HEAD:core-gcs-unknown-recovery
          fi
