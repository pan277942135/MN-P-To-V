name: Durable Character Cutover

on:
  push:
    branches:
      - core-durable-character-library
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    env:
      VEO_OUTPUT_BUCKET: ai-studio-bucket-89614354864-asia-south1
      NODE_ENV: test
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: core-durable-character-library
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Normalize Veo character lookup anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('server.ts')
          source = path.read_text()
          legacy = "      const storedChar = characterId ? serverCharacterStore.get(characterId) : undefined;"
          normalized = "      const storedChar = serverCharacterStore.get(characterId);"
          if legacy in source:
              path.write_text(source.replace(legacy, normalized, 1))
              print('normalized Veo start character lookup')
          elif 'durableCharacterService.getHydrated(characterId)' in source:
              print('durable lookup already applied')
          elif source.count(normalized) >= 2:
              print('lookup anchors already normalized')
          else:
              raise SystemExit('expected Veo start character lookup anchor not found')
          PY

      - name: Apply durable character route migration
        run: node scripts/apply_durable_character_patch_v2.mjs

      - name: TypeScript gate
        run: npm run lint

      - name: Full regression suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Diff integrity
        run: git diff --check

      - name: Persist verified route patch
        run: |
          if git diff --quiet -- server.ts; then
            echo "Durable character route patch already persisted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          git commit -m "feat: cut character APIs over to Firestore and GCS"
          git push origin HEAD:core-durable-character-library
