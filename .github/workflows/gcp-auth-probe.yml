name: GCP Auth Probe

on:
  push:
    branches:
      - p0-5-real-e2e-hardening

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      HAS_GCP_SA_KEY: ${{ secrets.GCP_SA_KEY != '' }}
      HAS_GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS != '' }}
      HAS_GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS != '' }}
      HAS_GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY != '' }}
      HAS_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}
      HAS_WIF_PROVIDER: ${{ secrets.WIF_PROVIDER != '' }}
      HAS_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
      HAS_GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT != '' }}
      HAS_VAR_WIF_PROVIDER: ${{ vars.WIF_PROVIDER != '' }}
      HAS_VAR_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
      HAS_VAR_GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT != '' }}
      HAS_VAR_CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE != '' }}
      HAS_VAR_CLOUD_RUN_REGION: ${{ vars.CLOUD_RUN_REGION != '' }}
    steps:
      - name: Report credential/config availability only
        shell: bash
        run: |
          echo "GCP_SA_KEY=${HAS_GCP_SA_KEY}"
          echo "GOOGLE_CREDENTIALS=${HAS_GOOGLE_CREDENTIALS}"
          echo "GCP_CREDENTIALS=${HAS_GCP_CREDENTIALS}"
          echo "GCP_SERVICE_ACCOUNT_KEY=${HAS_GCP_SERVICE_ACCOUNT_KEY}"
          echo "GOOGLE_SERVICE_ACCOUNT_JSON=${HAS_GOOGLE_SERVICE_ACCOUNT_JSON}"
          echo "WIF_PROVIDER=${HAS_WIF_PROVIDER}"
          echo "GCP_WORKLOAD_IDENTITY_PROVIDER=${HAS_GCP_WORKLOAD_IDENTITY_PROVIDER}"
          echo "GCP_SERVICE_ACCOUNT=${HAS_GCP_SERVICE_ACCOUNT}"
          echo "VAR_WIF_PROVIDER=${HAS_VAR_WIF_PROVIDER}"
          echo "VAR_GCP_WORKLOAD_IDENTITY_PROVIDER=${HAS_VAR_GCP_WORKLOAD_IDENTITY_PROVIDER}"
          echo "VAR_GCP_SERVICE_ACCOUNT=${HAS_VAR_GCP_SERVICE_ACCOUNT}"
          echo "VAR_CLOUD_RUN_SERVICE=${HAS_VAR_CLOUD_RUN_SERVICE}"
          echo "VAR_CLOUD_RUN_REGION=${HAS_VAR_CLOUD_RUN_REGION}"
