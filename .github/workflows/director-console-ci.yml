name: Director Console CI

on:
  pull_request:
    paths:
      - 'src/App.tsx'
      - 'src/components/Sidebar.tsx'
      - 'src/pages/ScriptDirectorPage.tsx'
      - 'src/pages/AutoStoryboardDirectorPage.tsx'
      - 'src/services/director/localStoryboardGenerator.ts'
      - 'src/pages/DirectorConsolePage.tsx'
      - 'episode-server.ts'
      - 'src/server/services/episodeProductionRunner.ts'
      - 'src/server/services/keyframeInputResolver.ts'
      - 'src/__tests__/episodeProductionApi.test.ts'
      - 'src/__tests__/directorConsoleSourceContract.test.ts'
      - 'src/__tests__/scriptDirectorPage.test.tsx'
      - 'src/__tests__/manualStoryboardDirectorPage.test.tsx'
      - 'src/__tests__/autoStoryboardGenerator.test.ts'
      - 'src/__tests__/autoStoryboardDirectorPage.test.tsx'
      - 'Dockerfile'
      - '.github/workflows/director-console-ci.yml'
      - '.github/workflows/director-console-uat-deploy.yml'
  push:
    branches:
      - main
    paths:
      - 'src/App.tsx'
      - 'src/components/Sidebar.tsx'
      - 'src/pages/ScriptDirectorPage.tsx'
      - 'src/pages/AutoStoryboardDirectorPage.tsx'
      - 'src/services/director/localStoryboardGenerator.ts'
      - 'src/pages/DirectorConsolePage.tsx'
      - 'episode-server.ts'
      - 'src/server/services/episodeProductionRunner.ts'
      - 'src/server/services/keyframeInputResolver.ts'
      - 'src/__tests__/episodeProductionApi.test.ts'
      - 'src/__tests__/directorConsoleSourceContract.test.ts'
      - 'src/__tests__/scriptDirectorPage.test.tsx'
      - 'src/__tests__/manualStoryboardDirectorPage.test.tsx'
      - 'src/__tests__/autoStoryboardGenerator.test.ts'
      - 'src/__tests__/autoStoryboardDirectorPage.test.tsx'
      - 'Dockerfile'
      - '.github/workflows/director-console-ci.yml'
      - '.github/workflows/director-console-uat-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun run lint

      - name: Director / Episode regression tests
        run: >-
          bunx vitest run
          src/__tests__/scriptDirectorPage.test.tsx
          src/__tests__/manualStoryboardDirectorPage.test.tsx
          src/__tests__/autoStoryboardGenerator.test.ts
          src/__tests__/autoStoryboardDirectorPage.test.tsx
          src/__tests__/episodeProductionApi.test.ts
          src/__tests__/episodeProductionRunner.test.ts
          src/__tests__/p07EpisodeDurableInput.test.ts
          src/__tests__/directorConsoleSourceContract.test.ts

      - name: Build formal React + Episode server artifact
        run: bun run build
