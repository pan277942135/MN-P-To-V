name: Deploy Verified M2-1 Source Artifact to Production

on:
  push:
    branches:
      - prod-deploy-m21-direct-fix

permissions:
  contents: read
  id-token: write

env:
  SOURCE_SHA: d5a29a151b8d230e583aeea190b9ebc062968d87
  PROJECT_ID: xp-vertex-project
  REGION: asia-south1
  SERVICE: service-0804
  WIF_PROVIDER: projects/89614354864/locations/global/workloadIdentityPools/github-actions-mnptov/providers/repo
  DEPLOY_SA: github-deployer@xp-vertex-project.iam.gserviceaccount.com

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact merged source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Verify source contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'masterImageBuffers: masterBuffers' server.ts
          grep -Fq 'scenePreservationScore: 100' src/services/character/identityLockService.ts
          grep -Fq '...masterParts' src/services/qa/visualQaService.ts
          grep -Fq '(pipelineError as any).startData = startData' src/pages/StudioPage.tsx
          grep -Fq "legacyErrorText.includes('角色一致性质检未通过')" src/pages/TaskHistoryPage.tsx
          grep -Fq '(task as any).firstFrameQaReport' src/utils/taskHelper.ts
          if grep -Fq 'const masterBufForQa = masterBuffers[0]' server.ts; then
            echo 'Single-master QA wiring still present.' >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies and build compiled artifact
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npm run build
          test -s dist/server.cjs
          test -s dist/index.html
          grep -R -Fq '该任务在提交 Veo 前被首帧角色质检拦截' dist/assets
          grep -R -Fq '首帧角色/画面质检触发硬拦截' dist/assets

      - name: Local health smoke test
        shell: bash
        run: |
          set -euo pipefail
          PORT=3000 NODE_ENV=production node dist/server.cjs > /tmp/zaojing-smoke.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health -o /tmp/health.json; then
              break
            fi
            sleep 1
          done
          cat /tmp/health.json
          jq -e '.status == "ok"' /tmp/health.json >/dev/null

      - name: Authenticate to Google Cloud via WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
          create_credentials_file: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Snapshot current production configuration
        id: before
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format=export > service-before.yaml
          gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format=json > service-before.json
          PREV_REVISION="$(jq -r '.status.latestReadyRevisionName' service-before.json)"
          SERVICE_URL="$(jq -r '.status.url' service-before.json)"
          SOURCES_JSON="$(jq -r '.spec.template.metadata.annotations["run.googleapis.com/sources"]' service-before.json)"
          BASE_IMAGES_JSON="$(jq -r '.spec.template.metadata.annotations["run.googleapis.com/base-images"]' service-before.json)"
          PREV_SOURCE_URI="$(printf '%s' "$SOURCES_JSON" | jq -r '.["app-container"]')"
          PREV_SOURCE_URI="${PREV_SOURCE_URI%%#*}"
          BASE_IMAGE="$(printf '%s' "$BASE_IMAGES_JSON" | jq -r '.["app-container"]')"
          [[ "$PREV_SOURCE_URI" == gs://* ]]
          [[ "$(jq -r '.spec.template.spec.containers[0].image' service-before.json)" == 'scratch' ]]
          echo "previous_revision=$PREV_REVISION" >> "$GITHUB_OUTPUT"
          echo "service_url=$SERVICE_URL" >> "$GITHUB_OUTPUT"
          echo "previous_source_uri=$PREV_SOURCE_URI" >> "$GITHUB_OUTPUT"
          echo "base_image=$BASE_IMAGE" >> "$GITHUB_OUTPUT"
          echo "Previous revision: $PREV_REVISION"
          echo "Previous source: $PREV_SOURCE_URI"
          echo "Base image: $BASE_IMAGE"

      - name: Package production source artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          PATHS=()
          for p in .env.example .gitignore CHANGELOG.md assets bun.lock data dist firebase-applet-config.json firestore.rules index.html metadata.json node_modules package.json server.ts src tsconfig.json vite.config.ts; do
            if [ -e "$p" ]; then PATHS+=("$p"); fi
          done
          tar -czf build_artifacts.tar.gz "${PATHS[@]}"
          test -s build_artifacts.tar.gz
          tar -tzf build_artifacts.tar.gz | grep -Fxq 'dist/server.cjs'
          tar -tzf build_artifacts.tar.gz | grep -Fxq 'package.json'
          tar -tzf build_artifacts.tar.gz | grep -q '^node_modules/'
          SHA256="$(sha256sum build_artifacts.tar.gz | awk '{print $1}')"
          SIZE="$(stat -c '%s' build_artifacts.tar.gz)"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          ls -lh build_artifacts.tar.gz
          echo "artifact_sha256=$SHA256"

      - name: Upload immutable source artifact and prepare exact config patch
        id: source
        shell: bash
        env:
          PREV_SOURCE_URI: ${{ steps.before.outputs.previous_source_uri }}
        run: |
          set -euo pipefail
          BUCKET="$(printf '%s' "$PREV_SOURCE_URI" | sed -E 's#^(gs://[^/]+).*$#\1#')"
          NEW_SOURCE_URI="$BUCKET/services/$SERVICE/github-$SOURCE_SHA/compiled/build_artifacts.tar.gz"
          gcloud storage cp build_artifacts.tar.gz "$NEW_SOURCE_URI"
          REMOTE_SIZE="$(gcloud storage objects describe "$NEW_SOURCE_URI" --format='value(size)')"
          test "$REMOTE_SIZE" = '${{ steps.artifact.outputs.size }}'
          echo "new_source_uri=$NEW_SOURCE_URI" >> "$GITHUB_OUTPUT"

          python3 - "$NEW_SOURCE_URI" <<'PY'
          import json, re, sys
          from pathlib import Path
          new_uri = sys.argv[1]
          text = Path('service-before.yaml').read_text()
          pattern = r'(run.googleapis.com/sources:\s*[\"\']?)(\{[^\n]+\})([\"\']?)'
          m = re.search(pattern, text)
          if not m:
              raise SystemExit('run.googleapis.com/sources annotation not found in exported YAML')
          old_json_raw = m.group(2).replace('\\"', '"')
          old = json.loads(old_json_raw)
          if 'app-container' not in old:
              raise SystemExit('app-container source key missing')
          updated = dict(old)
          updated['app-container'] = new_uri
          replacement_json = json.dumps(updated, separators=(',', ':'))
          # Preserve the YAML quoting style by escaping inner quotes if needed.
          if m.group(1).rstrip().endswith("'"):
              replacement_json = replacement_json.replace("'", "''")
          elif m.group(1).rstrip().endswith('"'):
              replacement_json = replacement_json.replace('"', '\\"')
          patched = text[:m.start(2)] + replacement_json + text[m.end(2):]
          Path('service-patched.yaml').write_text(patched)
          # Hard scope guard: after normalizing the one source URI, files must match byte-for-byte.
          normalized = patched.replace(new_uri, old['app-container'])
          if normalized != text:
              raise SystemExit('Config patch changed more than the source URI')
          print('Config patch scope: ONLY run.googleapis.com/sources app-container URI')
          PY

          grep -Fq "$NEW_SOURCE_URI" service-patched.yaml
          echo "New source: $NEW_SOURCE_URI"

      - name: Deploy source-only patch, verify live, rollback automatically on failure
        id: deploy
        shell: bash
        env:
          NEW_SOURCE_URI: ${{ steps.source.outputs.new_source_uri }}
          PREV_REVISION: ${{ steps.before.outputs.previous_revision }}
          SERVICE_URL_BEFORE: ${{ steps.before.outputs.service_url }}
          BASE_IMAGE_BEFORE: ${{ steps.before.outputs.base_image }}
        run: |
          set -Eeuo pipefail
          DEPLOYED=0
          rollback() {
            rc=$?
            if [ "$DEPLOYED" = 1 ]; then
              echo "Verification failed; restoring previous exported configuration..." >&2
              gcloud run services replace service-before.yaml --project="$PROJECT_ID" --region="$REGION" --quiet || true
            fi
            exit "$rc"
          }
          trap rollback ERR

          gcloud run services replace service-patched.yaml --project="$PROJECT_ID" --region="$REGION" --quiet
          DEPLOYED=1

          gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format=json > service-after.json
          NEW_REVISION="$(jq -r '.status.latestReadyRevisionName' service-after.json)"
          SERVICE_URL="$(jq -r '.status.url' service-after.json)"
          SOURCES_JSON="$(jq -r '.spec.template.metadata.annotations["run.googleapis.com/sources"]' service-after.json)"
          BASE_IMAGES_JSON="$(jq -r '.spec.template.metadata.annotations["run.googleapis.com/base-images"]' service-after.json)"
          LIVE_SOURCE_URI="$(printf '%s' "$SOURCES_JSON" | jq -r '.["app-container"]')"
          LIVE_SOURCE_URI="${LIVE_SOURCE_URI%%#*}"
          LIVE_BASE_IMAGE="$(printf '%s' "$BASE_IMAGES_JSON" | jq -r '.["app-container"]')"

          test "$NEW_REVISION" != "$PREV_REVISION"
          test "$LIVE_SOURCE_URI" = "$NEW_SOURCE_URI"
          test "$LIVE_BASE_IMAGE" = "$BASE_IMAGE_BEFORE"
          test "$(jq -r '.spec.template.spec.containers[0].image' service-after.json)" = 'scratch'

          # Critical runtime settings must remain exactly the same.
          jq -S '{env:.spec.template.spec.containers[0].env,args:.spec.template.spec.containers[0].args,command:.spec.template.spec.containers[0].command,resources:.spec.template.spec.containers[0].resources,ports:.spec.template.spec.containers[0].ports,startupProbe:.spec.template.spec.containers[0].startupProbe,minScale:.spec.template.metadata.annotations["autoscaling.knative.dev/minScale"],maxScale:.spec.template.metadata.annotations["autoscaling.knative.dev/maxScale"],baseImages:.spec.template.metadata.annotations["run.googleapis.com/base-images"]}' service-before.json > critical-before.json
          jq -S '{env:.spec.template.spec.containers[0].env,args:.spec.template.spec.containers[0].args,command:.spec.template.spec.containers[0].command,resources:.spec.template.spec.containers[0].resources,ports:.spec.template.spec.containers[0].ports,startupProbe:.spec.template.spec.containers[0].startupProbe,minScale:.spec.template.metadata.annotations["autoscaling.knative.dev/minScale"],maxScale:.spec.template.metadata.annotations["autoscaling.knative.dev/maxScale"],baseImages:.spec.template.metadata.annotations["run.googleapis.com/base-images"]}' service-after.json > critical-after.json
          diff -u critical-before.json critical-after.json

          curl -fsS "$SERVICE_URL/api/health" -o health.json
          cat health.json
          jq -e '.status == "ok"' health.json >/dev/null

          curl -fsS "$SERVICE_URL/" -o index-live.html
          ASSET_PATH="$(grep -oE 'src="/[^"]+\.js"' index-live.html | head -1 | cut -d'"' -f2)"
          test -n "$ASSET_PATH"
          curl -fsS "$SERVICE_URL$ASSET_PATH" -o app-live.js
          grep -Fq '该任务在提交 Veo 前被首帧角色质检拦截' app-live.js
          grep -Fq '首帧角色/画面质检触发硬拦截' app-live.js
          grep -Fq '首帧 QA 详细分数未保留' app-live.js
          grep -Fq 'Google 未返回具体过滤原因' app-live.js

          curl -fsS "$SERVICE_URL/api/videos/audit" -o audit.json
          jq -e '.storageAuthority == "firestore"' audit.json >/dev/null

          trap - ERR
          echo "new_revision=$NEW_REVISION" >> "$GITHUB_OUTPUT"
          echo "service_url=$SERVICE_URL" >> "$GITHUB_OUTPUT"
          echo "live_source_uri=$LIVE_SOURCE_URI" >> "$GITHUB_OUTPUT"
          echo "Production verification PASS: revision=$NEW_REVISION"

      - name: Publish deployment evidence
        shell: bash
        run: |
          {
            echo '## Production M2-1 source deployment PASS'
            echo "- Source commit: \`$SOURCE_SHA\`"
            echo "- Previous revision: \`${{ steps.before.outputs.previous_revision }}\`"
            echo "- New revision: \`${{ steps.deploy.outputs.new_revision }}\`"
            echo "- Source artifact: \`${{ steps.deploy.outputs.live_source_uri }}\`"
            echo "- Artifact SHA-256: \`${{ steps.artifact.outputs.sha256 }}\`"
            echo '- Deployment model preserved: scratch + source artifact + Node.js 22 base image'
            echo '- Existing env/resources/scaling/command/ports/startup probe: unchanged'
            echo '- Health: PASS'
            echo '- Live frontend identity UX: PASS'
            echo '- Firestore authority: PASS'
            echo '- No Veo generation invoked'
          } >> "$GITHUB_STEP_SUMMARY"
