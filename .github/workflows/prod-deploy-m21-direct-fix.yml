name: Validate Production Runtime Contract

on:
  push:
    branches:
      - prod-deploy-m21-direct-fix

permissions:
  contents: read

env:
  SOURCE_SHA: d5a29a151b8d230e583aeea190b9ebc062968d87
  PROJECT_ID: xp-vertex-project
  VEO_OUTPUT_BUCKET: ai-studio-bucket-89614354864-asia-south1
  FIRESTORE_DATABASE_ID: ai-studio-0806-1d34279b-010b-4a28-8239-d080392dee29

jobs:
  runtime-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact merged source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Verify canonical production contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "EXPECTED_PRODUCTION_VEO_BUCKET = 'ai-studio-bucket-89614354864-asia-south1'" src/server/storage/gcsArtifactStore.ts
          grep -Fq "process.env.P0_DISABLE_STARTUP_RECOVERY === '1'" server.ts
          grep -Fq 'masterImageBuffers: masterBuffers' server.ts
          grep -Fq 'scenePreservationScore: 100' src/services/character/identityLockService.ts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and build
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npm run build
          test -s dist/server.cjs
          test -s dist/index.html

      - name: Canonical production-mode smoke
        shell: bash
        env:
          PORT: '3000'
          NODE_ENV: production
          P0_DISABLE_STARTUP_RECOVERY: '1'
          GOOGLE_CLOUD_PROJECT: ${{ env.PROJECT_ID }}
          GCP_PROJECT: ${{ env.PROJECT_ID }}
          VEO_OUTPUT_BUCKET: ${{ env.VEO_OUTPUT_BUCKET }}
          FIRESTORE_DATABASE_ID: ${{ env.FIRESTORE_DATABASE_ID }}
        run: |
          set -euo pipefail
          node dist/server.cjs > /tmp/zaojing-smoke.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          OK=0
          for i in $(seq 1 30); do
            if ! kill -0 "$PID" 2>/dev/null; then
              echo 'Server exited before health became ready.' >&2
              cat /tmp/zaojing-smoke.log >&2 || true
              exit 1
            fi
            if curl -fsS http://127.0.0.1:3000/api/health -o /tmp/health.json; then
              OK=1
              break
            fi
            sleep 1
          done
          if [ "$OK" != 1 ]; then
            echo 'Health endpoint did not become ready.' >&2
            cat /tmp/zaojing-smoke.log >&2 || true
            exit 1
          fi
          cat /tmp/health.json
          jq -e '.status == "ok"' /tmp/health.json >/dev/null
          grep -Fq 'Server listening on http://0.0.0.0:3000' /tmp/zaojing-smoke.log
          grep -Fq 'Startup recovery disabled for local runtime smoke' /tmp/zaojing-smoke.log
          echo 'Canonical production-mode runtime smoke PASS.'
