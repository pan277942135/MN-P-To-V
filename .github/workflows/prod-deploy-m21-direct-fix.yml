name: Inspect Production Image Source

on:
  push:
    branches:
      - prod-deploy-m21-direct-fix

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: xp-vertex-project
  REGION: asia-south1
  SERVICE: service-0804
  WIF_PROVIDER: projects/89614354864/locations/global/workloadIdentityPools/github-actions-mnptov/providers/repo
  DEPLOY_SA: github-deployer@xp-vertex-project.iam.gserviceaccount.com

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
          create_credentials_file: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Inspect service and latest ready revision read-only
        shell: bash
        run: |
          set -euo pipefail
          echo '--- SERVICE SUMMARY ---'
          gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" \
            --format='yaml(metadata.name,metadata.annotations,spec.template.metadata.annotations,spec.template.spec.containers,status.url,status.latestReadyRevisionName,status.latestCreatedRevisionName)'

          REVISION="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.latestReadyRevisionName)')"
          test -n "$REVISION"
          echo "LATEST_READY_REVISION=$REVISION"
          echo '--- REVISION SUMMARY ---'
          gcloud run revisions describe "$REVISION" --project="$PROJECT_ID" --region="$REGION" \
            --format='yaml(metadata.name,metadata.annotations,spec.containers,status.conditions,status.imageDigest)'

          echo '--- REVISION IMAGE VALUES ---'
          gcloud run revisions describe "$REVISION" --project="$PROJECT_ID" --region="$REGION" \
            --format='value(spec.containers[0].image)'
          gcloud run revisions describe "$REVISION" --project="$PROJECT_ID" --region="$REGION" \
            --format='value(status.imageDigest)'

          echo '--- ARTIFACT REGISTRY REPOSITORIES ---'
          gcloud artifacts repositories list --project="$PROJECT_ID" --format='table(name,format,location)' || true

          echo '--- RECENT DOCKER IMAGES (asia-south1) ---'
          for repo in $(gcloud artifacts repositories list --project="$PROJECT_ID" --location="$REGION" --filter='format=DOCKER' --format='value(name)' 2>/dev/null); do
            echo "REPO=$repo"
            gcloud artifacts docker images list "$REGION-docker.pkg.dev/$PROJECT_ID/$repo" --project="$PROJECT_ID" --limit=10 --sort-by='~UPDATE_TIME' --format='table(package,version,updateTime)' || true
          done

          echo 'Read-only production inspection complete; no Cloud Run mutation and no Veo call.'
