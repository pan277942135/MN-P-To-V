name: Inspect Production Source Artifact

on:
  push:
    branches:
      - prod-deploy-m21-direct-fix

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: xp-vertex-project
  REGION: asia-south1
  SERVICE: service-0804
  WIF_PROVIDER: projects/89614354864/locations/global/workloadIdentityPools/github-actions-mnptov/providers/repo
  DEPLOY_SA: github-deployer@xp-vertex-project.iam.gserviceaccount.com

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
          create_credentials_file: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Download and inspect current compiled artifact read-only
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format=json > service.json
          SOURCES_JSON="$(jq -r '.spec.template.metadata.annotations["run.googleapis.com/sources"]' service.json)"
          BASE_IMAGES_JSON="$(jq -r '.spec.template.metadata.annotations["run.googleapis.com/base-images"]' service.json)"
          SOURCE_URI="$(printf '%s' "$SOURCES_JSON" | jq -r '.["app-container"]')"
          SOURCE_URI="${SOURCE_URI%%#*}"
          BASE_IMAGE="$(printf '%s' "$BASE_IMAGES_JSON" | jq -r '.["app-container"]')"
          echo "SOURCE_URI=$SOURCE_URI"
          echo "BASE_IMAGE=$BASE_IMAGE"
          [[ "$SOURCE_URI" == gs://* ]]
          gcloud storage cp "$SOURCE_URI" current-build-artifacts.tar.gz
          ls -lh current-build-artifacts.tar.gz
          echo '--- TOP LEVEL ---'
          tar -tzf current-build-artifacts.tar.gz | awk -F/ 'NF<=2' | head -100 || true
          echo '--- KEY FILES ---'
          tar -tzf current-build-artifacts.tar.gz | grep -E '(^|/)(package.json|server.js|dist/server.cjs|node_modules/|index.html)$' | head -80 || true
          mkdir current-artifact
          tar -xzf current-build-artifacts.tar.gz -C current-artifact
          echo '--- ROOT LIST ---'
          find current-artifact -maxdepth 2 -type f -printf '%P\t%s bytes\n' | sort | head -120
          echo '--- PACKAGE.JSON ---'
          PKG="$(find current-artifact -maxdepth 2 -name package.json -type f | head -1)"
          test -n "$PKG"
          cat "$PKG"
          echo '--- STARTUP TARGETS ---'
          find current-artifact -maxdepth 3 \( -name server.js -o -path '*/dist/server.cjs' \) -type f -printf '%P\t%s bytes\n' || true
          echo 'Read-only artifact inspection complete; no service mutation and no Veo call.'
