name: Pre-Provider Durability Boundary

on:
  workflow_dispatch:
  push:
    branches:
      - core-pre-provider-durability-boundary
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pre-provider-boundary:
    runs-on: ubuntu-latest
    env:
      VEO_OUTPUT_BUCKET: ai-studio-bucket-89614354864-asia-south1
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pre-provider durability contract gate
        run: |
          grep -q "status: 'preparing'" server.ts
          grep -q "const initialExecutionId = \`exec_\${crypto.randomUUID()}\`" server.ts
          grep -q "leaseExpiresAt: initialLeaseExpiresAt" server.ts
          grep -q "taskStateMachineService.authorizeProviderSubmission" server.ts
          grep -q "providerSubmissionAuthorizedAt" src/server/services/taskStateMachineService.ts
          grep -q "failPreparingBeforeProvider" src/server/services/taskStateMachineService.ts
          grep -q "reconcileStalePreparingTask" src/server/services/taskStateMachineService.ts
          grep -q "failureReason: 'pre_provider_abandoned'" src/server/services/taskStateMachineService.ts
          grep -q "failureReason: 'pre_provider_authorization_failed'" src/server/services/taskStateMachineService.ts
          grep -q "retryMode: 'SAFE_TO_REGENERATE'" src/server/services/taskStateMachineService.ts
          grep -q "rec.status === 'submitting'" server.ts
          grep -q "providerInvocationAuthorized: false" server.ts
          grep -q "runTaskTransaction" src/__tests__/apiVideoStartRouteIntegration.test.ts
          grep -q "never downgrades a durably authorized submitting task" src/__tests__/preProviderDurabilityBoundary.test.ts
          grep -q "keeps inconsistent preparing records with Provider authorization evidence fail-closed" src/__tests__/preProviderDurabilityBoundary.test.ts
          if grep -q "const leaseResult = await taskStateMachineService.acquireLease({" server.ts; then
            echo "initial provider path must not have a post-create lease acquisition gap" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: TypeScript gate
        run: npm run lint

      - name: Full regression suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Diff integrity
        run: git diff --check
