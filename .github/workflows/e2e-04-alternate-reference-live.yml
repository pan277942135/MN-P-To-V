name: E2E-04 Alternate Reference Live

on:
  push:
    branches: [e2e-04-character-reference-final]
    paths:
      - '.github/workflows/e2e-04-alternate-reference-live.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

env:
  URL: https://zaojing-chatgpt-gateway-uat-i7lns3auvq-uc.a.run.app
  CHARACTER_ID: char_731dace9-bfaf-44e3-b280-be90f3708518
  PROJECT_ID: xp-vertex-project
  VEO_OUTPUT_BUCKET: ai-studio-bucket-89614354864-asia-south1
  WIF_PROVIDER: projects/89614354864/locations/global/workloadIdentityPools/github-actions-mnptov/providers/repo
  DEPLOY_SA: github-deployer@xp-vertex-project.iam.gserviceaccount.com

jobs:
  alternate-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Authenticate for final artifact proof
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
          create_credentials_file: true

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Try ref_1 then ref_2 with the same minimal prompt
        id: run
        shell: bash
        run: |
          set -euo pipefail
          : > alternate-history.txt
          SUCCESS_TASK=''
          SUCCESS_REF=''

          for REF in ref_1 ref_2; do
            INDEX="${REF#ref_}"
            echo "reference-$REF" > stage.txt

            # Prove that the selected durable reference is retrievable as real image bytes.
            HTTP="$(curl -sS -D "${REF}.headers" -o "${REF}.bin" -w '%{http_code}' "$URL/v1/characters/$CHARACTER_ID/references/$REF")"
            test "$HTTP" = '200'
            BYTES="$(stat -c%s "${REF}.bin")"
            test "$BYTES" -ge 1000
            echo "REF $REF BYTES $BYTES HEADERS $(tr '\n' ' ' < "${REF}.headers")" >> alternate-history.txt

            IDEM="e2e04alt-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${INDEX}"
            jq -nc --arg cid "$CHARACTER_ID" --arg rid "$REF" --arg idem "$IDEM" '{prompt:"Fixed camera. Keep the person in the same pose and preserve the original scene. Only gentle natural breathing.",durationSeconds:4,idempotencyKey:$idem,inputSource:{type:"character_reference",characterId:$cid,referenceId:$rid}}' > request.json
            curl -sS -X POST -H 'Content-Type: application/json' --data-binary @request.json "$URL/v1/videos" -o create.json
            echo "CREATE $REF $(jq -c . create.json)" >> alternate-history.txt
            TASK="$(jq -r '.taskId // empty' create.json)"
            if [ -z "$TASK" ]; then
              continue
            fi
            cp create.json status.json

            for POLL in $(seq 1 40); do
              STATUS="$(jq -r '.status // empty' status.json 2>/dev/null || true)"
              case "$STATUS" in COMPLETED|FAILED|SUBMISSION_OUTCOME_UNKNOWN) break;; esac
              sleep 8
              PHTTP="$(curl -sS -o status.json -w '%{http_code}' "$URL/v1/videos/$TASK" || true)"
              echo "POLL $REF.$POLL HTTP=$PHTTP $(jq -c '{status,stage,providerAttempt,identityRetryCount,artifactPersisted,artifactVerified,sizeBytes,identityReport,error,inputSource}' status.json 2>/dev/null || true)" >> alternate-history.txt
            done

            STATUS="$(jq -r '.status // empty' status.json)"
            echo "FINAL $REF $(jq -c . status.json)" >> alternate-history.txt
            if [ "$STATUS" = 'COMPLETED' ]; then
              jq -e '.artifactPersisted == true and .artifactVerified == true and .videoReady == true and .sizeBytes >= 1000' status.json >/dev/null
              jq -e '.identityReport.pass == true and .identityReport.gateStatus == "pass"' status.json >/dev/null
              jq -e '.inputSource.type == "character_reference" and .inputSource.characterId == $cid and .inputSource.referenceId == $rid' --arg cid "$CHARACTER_ID" --arg rid "$REF" status.json >/dev/null
              SUCCESS_TASK="$TASK"
              SUCCESS_REF="$REF"
              cp status.json success.json
              break
            fi

            # Only proceed to the second reference after an explicit terminal provider/identity failure.
            if [ "$STATUS" != 'FAILED' ]; then
              break
            fi
          done

          echo "success_task=$SUCCESS_TASK" >> "$GITHUB_OUTPUT"
          echo "success_ref=$SUCCESS_REF" >> "$GITHUB_OUTPUT"
          test -n "$SUCCESS_TASK"

      - name: Verify successful canonical MP4
        id: mp4
        if: steps.run.outputs.success_task != ''
        shell: bash
        env:
          TASK_ID: ${{ steps.run.outputs.success_task }}
        run: |
          set -euo pipefail
          OBJECT="gs://$VEO_OUTPUT_BUCKET/veo/$TASK_ID/video.mp4"
          echo "object=$OBJECT" >> "$GITHUB_OUTPUT"
          gcloud storage cp "$OBJECT" result.mp4
          BYTES="$(stat -c%s result.mp4)"
          test "$BYTES" -ge 1000
          python3 - <<'PY'
          from pathlib import Path
          b=Path('result.mp4').read_bytes()
          assert b'ftyp' in b[:64]
          print({'verifiedMp4Bytes':len(b),'ftyp':True})
          PY
          echo "bytes=$BYTES" >> "$GITHUB_OUTPUT"

      - name: Record alternate-reference evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SUCCESS_TASK: ${{ steps.run.outputs.success_task }}
          SUCCESS_REF: ${{ steps.run.outputs.success_ref }}
          MP4_OBJECT: ${{ steps.mp4.outputs.object }}
          MP4_BYTES: ${{ steps.mp4.outputs.bytes }}
        run: |
          set -euo pipefail
          HISTORY="$(cat alternate-history.txt 2>/dev/null || echo unavailable)"
          SUCCESS="$(cat success.json 2>/dev/null || echo unavailable)"
          BODY=$(cat <<EOF
          ### E2E-04 alternate-reference live evidence
          - Job status: \`${{ job.status }}\`
          - Source SHA: \`${GITHUB_SHA}\`
          - Character: \`$CHARACTER_ID\`
          - References tested: \`ref_1, ref_2 (max 2 tasks)\`
          - Successful reference: \`${SUCCESS_REF:-none}\`
          - Successful task: \`${SUCCESS_TASK:-none}\`
          - User master re-upload: \`false\`
          - Canonical MP4: \`${MP4_OBJECT:-unknown}\`
          - Canonical MP4 bytes: \`${MP4_BYTES:-unknown}\`

          History:
          \`\`\`text
          $HISTORY
          \`\`\`

          Successful final task:
          \`\`\`json
          $SUCCESS
          \`\`\`
          EOF
          )
          jq -nc --arg body "$BODY" '{body:$body}' > comment.json
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/47/comments" --data-binary @comment.json >/dev/null
