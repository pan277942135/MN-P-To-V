name: One-off Provider Race Hardening

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  VEO_OUTPUT_BUCKET: ai-studio-bucket-89614354864-asia-south1

jobs:
  harden:
    if: github.head_ref == 'fix/state-machine-provider-race-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Apply deterministic hardening patch
        run: python3 scripts/_apply-state-machine-race-hardening.py
      - name: Remove one-off hardening machinery from final tree
        run: |
          git rm .github/workflows/_oneoff-provider-race-hardening.yml
          git rm scripts/_apply-state-machine-race-hardening.py
          git rm docs/.state-machine-hardening-ready
          git rm docs/.state-machine-hardening-scope
          git rm docs/.state-machine-hardening-trigger
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: Targeted provider-race regression
        run: bunx vitest run src/__tests__/providerSubmissionRaceHardening.test.ts src/__tests__/p0DurableStateMachine.test.ts src/__tests__/preProviderDurabilityBoundary.test.ts src/__tests__/providerAdmissionPolicy.test.ts
      - name: Full regression
        run: bunx vitest run
      - name: Production build
        run: bun run build
      - name: Commit formal source and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts src/server/services/taskStateMachineService.ts src/services/tasks/taskReconciler.ts src/__tests__/providerSubmissionRaceHardening.test.ts
          git add -u .github/workflows scripts docs
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'fix: harden provider submission race recovery'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
