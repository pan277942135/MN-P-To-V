name: Provider Recovery UI Cutover

on:
  push:
    branches:
      - core-provider-recovery-ui
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    env:
      VEO_OUTPUT_BUCKET: ai-studio-bucket-89614354864-asia-south1
      NODE_ENV: test
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: core-provider-recovery-ui
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Apply provider recovery UI migration
        run: node scripts/apply_provider_recovery_ui_patch.mjs

      - name: TypeScript gate
        run: npm run lint

      - name: Full regression suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Diff integrity
        run: git diff --check

      - name: Persist verified UI patch
        run: |
          if git diff --quiet -- src/pages/TaskHistoryPage.tsx; then
            echo "Provider recovery UI migration already persisted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/TaskHistoryPage.tsx
          git commit -m "feat: expose fail-closed provider recovery in task history"
          git push origin HEAD:core-provider-recovery-ui
