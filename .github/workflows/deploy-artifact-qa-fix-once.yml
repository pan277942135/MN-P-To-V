name: Deploy Artifact QA Fix UAT Once

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-artifact-qa-fix-once.yml'

permissions:
  contents: read
  id-token: write

env:
  SOURCE_SHA: ececd8580a6bbef41d65ec3cbf049f2d80faab6c
  PROJECT_ID: xp-vertex-project
  REGION: us-central1
  GAR_REPO: zaojing
  SERVICE: zaojing-m2-uat
  WIF_PROVIDER: projects/89614354864/locations/global/workloadIdentityPools/github-actions-mnptov/providers/repo
  DEPLOY_SA: github-deployer@xp-vertex-project.iam.gserviceaccount.com
  RUNTIME_SA: zaojing-video-runtime@xp-vertex-project.iam.gserviceaccount.com
  VEO_OUTPUT_BUCKET: ai-studio-bucket-89614354864-asia-south1
  VEO_MODEL_ID: veo-3.1-fast-generate-001
  FIRESTORE_DATABASE_ID: ai-studio-0806-1d34279b-010b-4a28-8239-d080392dee29
  RECOVERY_TASK: task_67a832e1

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact accepted main source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
          create_credentials_file: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Build and push immutable image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPO/$SERVICE:$SOURCE_SHA"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy stable private IAP UAT
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --platform=managed \
            --image='${{ steps.image.outputs.image }}' \
            --service-account="$RUNTIME_SA" \
            --no-allow-unauthenticated \
            --iap \
            --cpu=1 \
            --memory=2Gi \
            --timeout=900 \
            --concurrency=8 \
            --min-instances=0 \
            --max-instances=4 \
            --set-env-vars="NODE_ENV=production,VEO_OUTPUT_BUCKET=$VEO_OUTPUT_BUCKET,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,VERTEX_LOCATION=$REGION,VEO_MODEL_ID=$VEO_MODEL_ID,RUNTIME_SERVICE_ACCOUNT_EMAIL=$RUNTIME_SA,FIRESTORE_DATABASE_ID=$FIRESTORE_DATABASE_ID,FIRST_FRAME_IDENTITY_QA_BLOCKING=false" \
            --quiet
          REVISION="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.latestReadyRevisionName)')"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Verify revision and existing artifact evidence
        shell: bash
        run: |
          set -euo pipefail
          REVISION='${{ steps.deploy.outputs.revision }}'
          gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format=json > /tmp/service.json
          gcloud run revisions describe "$REVISION" --project="$PROJECT_ID" --region="$REGION" --format=json > /tmp/revision.json

          VIDEO="gs://$VEO_OUTPUT_BUCKET/veo/$RECOVERY_TASK/video.mp4"
          FIRST_FRAME="gs://$VEO_OUTPUT_BUCKET/veo/$RECOVERY_TASK/qa/approved-first-frame"
          gcloud storage objects describe "$VIDEO" --format=json > /tmp/video.json
          gcloud storage objects describe "$FIRST_FRAME" --format=json > /tmp/first-frame.json
          gcloud storage cat "$FIRST_FRAME" | head -c 16 > /tmp/first-frame.head || true

          python3 - <<'PY'
          import json, os
          service=json.load(open('/tmp/service.json'))
          revision=json.load(open('/tmp/revision.json'))
          video=json.load(open('/tmp/video.json'))
          first=json.load(open('/tmp/first-frame.json'))
          head=open('/tmp/first-frame.head','rb').read()
          latest=(service.get('status') or {}).get('latestReadyRevisionName')
          iap=((service.get('metadata') or {}).get('annotations') or {}).get('run.googleapis.com/iap-enabled')
          envs=((revision.get('spec') or {}).get('containers') or [{}])[0].get('env') or []
          env={x.get('name'):x.get('value') for x in envs}
          ready=next((c.get('status') for c in ((revision.get('status') or {}).get('conditions') or []) if c.get('type')=='Ready'),None)
          video_size=int(video.get('size') or 0)
          first_size=int(first.get('size') or 0)
          first_type=str(first.get('content_type') or first.get('contentType') or '')
          is_jpeg=head[:3]==b'\xff\xd8\xff'
          is_png=head[:8]==b'\x89PNG\r\n\x1a\n'
          is_webp=len(head)>=12 and head[:4]==b'RIFF' and head[8:12]==b'WEBP'
          print('revision=',latest)
          print('iap_enabled=',iap)
          print('qa_blocking=',env.get('FIRST_FRAME_IDENTITY_QA_BLOCKING'))
          print('ready=',ready)
          print('existing_video_size=',video_size)
          print('first_frame_size=',first_size)
          print('first_frame_content_type=',first_type)
          print('first_frame_magic_valid=',is_jpeg or is_png or is_webp)
          assert latest == os.environ.get('REVISION_EXPECTED', latest)
          assert str(iap).lower()=='true'
          assert env.get('FIRST_FRAME_IDENTITY_QA_BLOCKING')=='false'
          assert str(ready).lower()=='true'
          assert video_size > 1000
          assert first_size > 0
          assert is_jpeg or is_png or is_webp
          PY
