name: Fix RAI Failure UX Guard

on:
  push:
    branches:
      - fix-rai-failure-ux-guard

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      VEO_OUTPUT_BUCKET: ai-studio-bucket-89614354864-asia-south1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply RAI UX guard
        run: python3 scripts/apply-rai-failure-ux-guard.py

      - name: Source contract gate
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "failureReason === 'output_rai_filtered'" src/pages/TaskHistoryPage.tsx
          grep -Fq "retryMode === 'REWRITE_INPUT_THEN_REGENERATE'" src/pages/TaskHistoryPage.tsx
          grep -Fq '返回工作台调整输入' src/pages/TaskHistoryPage.tsx
          grep -Fq 'RAI filtered count:' src/utils/taskHelper.ts
          if grep -Fq "task.retryMode !== 'SAFE_TO_REGENERATE' && task.retryMode !== 'REWRITE_INPUT_THEN_REGENERATE'" src/pages/TaskHistoryPage.tsx; then
            echo 'RAI rewrite mode is still in the one-click resubmit allowlist.' >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Focused RAI UX regression
        run: npx vitest run src/__tests__/raiFailureUxGuard.test.ts src/__tests__/veoFailureReasonAndSafety.test.ts

      - name: TypeScript gate
        run: npm run lint

      - name: Full regression suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Diff integrity
        run: git diff --check

      - name: Commit verified source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/TaskHistoryPage.tsx src/utils/taskHelper.ts
          if git diff --cached --quiet; then
            echo 'No source patch to commit.'
            exit 0
          fi
          git commit -m 'fix: make RAI failures require input rewrite'
          git push origin HEAD:fix-rai-failure-ux-guard
