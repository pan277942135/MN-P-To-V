name: MVP Simple UAT Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'mvp-server.ts'
      - 'mvp-server-v02.ts'
      - 'mvp-server-v021.ts'
      - 'Dockerfile.mvp'
      - 'src/mvp/**'
      - 'src/__tests__/mvpSimpleContract.test.ts'
      - 'src/__tests__/mvpIdentitySafe.test.ts'
      - 'src/__tests__/mvpNetworkDeadlineHardening.test.ts'
      - 'MVP_SIMPLE_ACCEPTANCE.md'
      - '.github/workflows/mvp-simple-uat-deploy.yml'
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Git ref to deploy'
        required: true
        default: 'main'

permissions:
  contents: read
  issues: write
  id-token: write

env:
  PROJECT_ID: xp-vertex-project
  PROJECT_NUMBER: '89614354864'
  REGION: us-central1
  GAR_REPO: zaojing
  SERVICE: zaojing-mvp-simple-uat
  STATUS_ISSUE: '47'
  WIF_PROVIDER: projects/89614354864/locations/global/workloadIdentityPools/github-actions-mnptov/providers/repo
  DEPLOY_SA: github-deployer@xp-vertex-project.iam.gserviceaccount.com
  RUNTIME_SA: zaojing-video-runtime@xp-vertex-project.iam.gserviceaccount.com
  VEO_OUTPUT_BUCKET: ai-studio-bucket-89614354864-asia-south1
  FIRESTORE_DATABASE_ID: ai-studio-0806-1d34279b-010b-4a28-8239-d080392dee29
  VEO_MODEL_ID: veo-3.1-fast-generate-001
  IDENTITY_QA_MODEL: gemini-2.5-flash

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}

      - name: Authenticate to Google Cloud via WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
          create_credentials_file: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Build and push immutable Identity Safe MVP image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPO/$SERVICE:$SOURCE_SHA"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -f Dockerfile.mvp -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Deploy isolated private Cloud Run UAT
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          IMAGE='${{ steps.image.outputs.image }}'
          SOURCE_SHA='${{ steps.image.outputs.source_sha }}'
          gcloud run deploy "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --platform=managed \
            --image="$IMAGE" \
            --service-account="$RUNTIME_SA" \
            --no-allow-unauthenticated \
            --no-iap \
            --cpu=2 \
            --memory=3Gi \
            --timeout=900 \
            --concurrency=4 \
            --min-instances=0 \
            --max-instances=2 \
            --set-env-vars="NODE_ENV=production,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,VERTEX_LOCATION=$REGION,VEO_OUTPUT_BUCKET=$VEO_OUTPUT_BUCKET,FIRESTORE_DATABASE_ID=$FIRESTORE_DATABASE_ID,VEO_MODEL_ID=$VEO_MODEL_ID,IDENTITY_QA_MODEL=$IDENTITY_QA_MODEL,RUNTIME_SERVICE_ACCOUNT_EMAIL=$RUNTIME_SA,COMMIT_SHA=$SOURCE_SHA" \
            --quiet

          gcloud run services add-iam-policy-binding "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --member="serviceAccount:$DEPLOY_SA" \
            --role="roles/run.invoker" \
            --quiet >/dev/null

          SERVICE_URL="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          REVISION="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.latestReadyRevisionName)')"
          echo "service_url=$SERVICE_URL" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Mint Cloud Run ID token for pre-IAP readiness
        uses: google-github-actions/auth@v3
        id: invoke_auth
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
          token_format: id_token
          id_token_audience: ${{ steps.deploy.outputs.service_url }}
          id_token_include_email: true

      - name: Verify Identity Safe v0.2.1 health and full readiness before browser gate
        id: verify
        shell: bash
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.service_url }}
          ID_TOKEN: ${{ steps.invoke_auth.outputs.id_token }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $ID_TOKEN" "$SERVICE_URL/api/mvp/health" | tee health.json
          grep -q '"mode":"MVP_IDENTITY_SAFE_V02"' health.json
          grep -q '"identityQaModel":"gemini-2.5-flash"' health.json
          curl -fsS -H "Authorization: Bearer $ID_TOKEN" "$SERVICE_URL/api/mvp/client-health" | tee client-health.json
          grep -q 'identity-safe-v0.2.1-network-hardening' client-health.json
          grep -q '"networkRecovery":true' client-health.json
          grep -q '"idempotencyLookup":true' client-health.json
          curl -fsS -H "Authorization: Bearer $ID_TOKEN" "$SERVICE_URL/api/mvp/readiness" | tee readiness.json
          grep -q '"ready":true' readiness.json
          curl -fsS -H "Authorization: Bearer $ID_TOKEN" "$SERVICE_URL/api/mvp/benchmark/catalog" | tee benchmark.json
          grep -q 'IDSAFE-24' benchmark.json

      - name: Enable direct IAP browser access
        id: iap
        shell: bash
        run: |
          set -uo pipefail
          : > iap.log
          IAP_AGENT="service-${PROJECT_NUMBER}@gcp-sa-iap.iam.gserviceaccount.com"

          echo '[iap] grant existing IAP service agent Cloud Run Invoker' | tee -a iap.log
          gcloud run services add-iam-policy-binding "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --member="serviceAccount:$IAP_AGENT" \
            --role="roles/run.invoker" \
            --quiet 2>&1 | tee -a iap.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            exit "$STATUS"
          fi

          echo '[iap] enable direct Cloud Run IAP' | tee -a iap.log
          gcloud run services update "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --iap \
            --quiet 2>&1 | tee -a iap.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            exit "$STATUS"
          fi

          echo '[iap] verify Cloud Run reports Iap Enabled: true' | tee -a iap.log
          gcloud run services describe "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" 2>&1 | tee service-description.txt | tee -a iap.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ] || ! grep -qi 'Iap Enabled: true' service-description.txt; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo 'enabled=true' >> "$GITHUB_OUTPUT"

      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo '## MVP Identity Safe v0.2.1 UAT ready'
            echo ''
            echo "- Source commit: \`${{ steps.image.outputs.source_sha }}\`"
            echo "- Cloud Run service: \`$SERVICE\`"
            echo "- Revision: \`${{ steps.deploy.outputs.revision }}\`"
            echo "- Fixed UAT URL: ${{ steps.deploy.outputs.service_url }}"
            echo "- Browser access: direct Cloud Run IAP / Google sign-in"
            echo "- IAP enabled: \`${{ steps.iap.outputs.enabled }}\`"
            echo "- Video model: \`$VEO_MODEL_ID\`"
            echo "- Identity QA model: \`$IDENTITY_QA_MODEL\`"
            echo "- Client network recovery: \`true\`"
            echo "- Idempotency lookup: \`true\`"
            echo "- Runtime auth: ADC / \`$RUNTIME_SA\`"
            echo "- Benchmark catalog: 24 cases"
            echo ''
            echo 'Transport interruptions no longer map to FAILED; the browser recovers the same durable task by idempotency key. Vertex Deadline exceeded is normalized to GENERATION_TIMEOUT.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish durable deployment evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          SOURCE_SHA: ${{ steps.image.outputs.source_sha }}
          SERVICE_URL: ${{ steps.deploy.outputs.service_url }}
          REVISION: ${{ steps.deploy.outputs.revision }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          IAP_OUTCOME: ${{ steps.iap.outcome }}
          IAP_ENABLED: ${{ steps.iap.outputs.enabled }}
        run: |
          set -euo pipefail
          READINESS="$(cat readiness.json 2>/dev/null || echo '{"ready":false,"evidence":"readiness unavailable"}')"
          CLIENT_HEALTH="$(cat client-health.json 2>/dev/null || echo '{"networkRecovery":false,"evidence":"client health unavailable"}')"
          IAP_LOG="$(tail -80 iap.log 2>/dev/null || echo 'iap.log unavailable')"
          BODY=$(cat <<EOF
          ### MVP Identity Safe v0.2.1 UAT deployment evidence
          - Job status: \`$JOB_STATUS\`
          - Source SHA: \`${SOURCE_SHA:-unavailable}\`
          - Cloud Run service: \`$SERVICE\`
          - Revision: \`${REVISION:-unavailable}\`
          - Fixed UAT URL: ${SERVICE_URL:-unavailable}
          - IAP step: \`${IAP_OUTCOME:-not_run}\`
          - IAP enabled: \`${IAP_ENABLED:-false}\`
          - Provider/model: \`Vertex AI / $VEO_MODEL_ID\`
          - Identity QA: \`Vertex AI / $IDENTITY_QA_MODEL\`
          - Network hardening: \`idempotency lookup + transport recovery\`
          - Benchmark catalog: \`24 cases\`
          - Readiness step: \`${VERIFY_OUTCOME:-not_run}\`

          Client health:
          \`\`\`json
          $CLIENT_HEALTH
          \`\`\`

          Readiness:
          \`\`\`json
          $READINESS
          \`\`\`

          IAP diagnostics:
          \`\`\`text
          $IAP_LOG
          \`\`\`
          EOF
          )
          jq -n --arg body "$BODY" '{body:$body}' > /tmp/issue-comment.json
          curl -fsS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${STATUS_ISSUE}/comments" \
            --data-binary @/tmp/issue-comment.json
