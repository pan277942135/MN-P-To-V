name: ChatGPT Gateway Cutover

on:
  push:
    branches: [core-chatgpt-gateway-v1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-persist:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VEO_OUTPUT_BUCKET: ai-studio-bucket-89614354864-asia-south1
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: core-chatgpt-gateway-v1
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Apply durable gateway patches
        run: |
          node scripts/apply_chatgpt_pairing_patch.mjs
          node scripts/apply_chatgpt_iap_auth_patch.mjs
      - name: TypeScript
        run: bun run lint
      - name: Gateway contract
        run: bunx vitest run src/__tests__/chatgptGatewayContract.test.ts
      - name: Full regression
        run: bun run test
      - name: Production build
        run: bun run build
      - name: Gateway image build
        run: docker build -f Dockerfile.chatgpt-gateway -t zaojing-chatgpt-gateway:ci .
      - name: Diff integrity
        run: git diff --check
      - name: Persist verified product tree
        run: |
          rm -f scripts/apply_chatgpt_pairing_patch.mjs scripts/apply_chatgpt_iap_auth_patch.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: establish ChatGPT Actions gateway boundary'
          git push origin HEAD:core-chatgpt-gateway-v1
