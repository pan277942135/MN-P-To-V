name: Director Console UAT Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'director-server.ts'
      - 'episode-server.ts'
      - 'server.ts'
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.ts'
      - 'index.html'
      - 'Dockerfile'
      - '.github/workflows/director-console-uat-deploy.yml'
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Git ref to deploy'
        required: true
        default: 'main'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: xp-vertex-project
  REGION: us-central1
  GAR_REPO: zaojing
  SERVICE: zaojing-director-console-uat
  WIF_PROVIDER: projects/89614354864/locations/global/workloadIdentityPools/github-actions-mnptov/providers/repo
  DEPLOY_SA: github-deployer@xp-vertex-project.iam.gserviceaccount.com
  RUNTIME_SA: zaojing-video-runtime@xp-vertex-project.iam.gserviceaccount.com
  VEO_OUTPUT_BUCKET: ai-studio-bucket-89614354864-asia-south1
  FIRESTORE_DATABASE_ID: ai-studio-0806-1d34279b-010b-4a28-8239-d080392dee29
  VEO_MODEL_ID: veo-3.1-fast-generate-001
  IDENTITY_QA_MODEL: gemini-2.5-flash
  DIRECTOR_STORYBOARD_MODEL: gemini-2.5-flash
  DIRECTOR_STORYBOARD_LOCATION: us-central1
  DIRECTOR_KEYFRAME_IMAGE_MODEL: gemini-3.1-flash-image
  DIRECTOR_KEYFRAME_IMAGE_LOCATION: global
  DIRECTOR_KEYFRAME_QA_MODEL: gemini-2.5-flash
  DIRECTOR_KEYFRAME_QA_LOCATION: global
  FIRESTORE_DIAGNOSTIC_ENABLED: '1'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}

      - name: Authenticate to Google Cloud via WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
          create_credentials_file: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify Firestore project, database, and runtime IAM
        id: firestore
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud projects describe "$PROJECT_ID" --format='value(projectId)')" = "$PROJECT_ID"
          gcloud firestore databases describe \
            --database="$FIRESTORE_DATABASE_ID" \
            --project="$PROJECT_ID" \
            --format='yaml(name,uid,locationId,type,concurrencyMode)'

          RUNTIME_MEMBER="serviceAccount:$RUNTIME_SA"
          if POLICY_BEFORE="$(gcloud projects get-iam-policy "$PROJECT_ID" --format=json 2>&1)"; then
            if jq -e --arg member "$RUNTIME_MEMBER" '
              any(.bindings[]?; .role == "roles/datastore.user" and any((.members // [])[]; . == $member))
            ' <<<"$POLICY_BEFORE" >/dev/null; then
              echo 'runtime_datastore_role_before=present' | tee -a "$GITHUB_OUTPUT"
            else
              echo 'runtime_datastore_role_before=missing' | tee -a "$GITHUB_OUTPUT"
              gcloud projects add-iam-policy-binding "$PROJECT_ID" \
                --member="$RUNTIME_MEMBER" \
                --role='roles/datastore.user' \
                --condition=None \
                --quiet
            fi

            POLICY_AFTER="$(gcloud projects get-iam-policy "$PROJECT_ID" --format=json)"
            jq -e --arg member "$RUNTIME_MEMBER" '
              any(.bindings[]?; .role == "roles/datastore.user" and any((.members // [])[]; . == $member))
            ' <<<"$POLICY_AFTER" >/dev/null
            echo 'runtime_datastore_role=verified' | tee -a "$GITHUB_OUTPUT"
          else
            # The deployment SA is intentionally not granted broad project IAM
            # administration. In that case the runtime probe below is the
            # authoritative check; do not silently attempt a broader grant.
            echo 'runtime_datastore_role_before=unverified_deploy_sa_iam_denied' | tee -a "$GITHUB_OUTPUT"
            echo 'runtime_datastore_role=runtime_probe_required' | tee -a "$GITHUB_OUTPUT"
            echo "$POLICY_BEFORE" >&2
          fi

      - name: Build and push formal React Studio image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPO/$SERVICE:$SOURCE_SHA"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -f Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Deploy Gemini Director preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          IMAGE='${{ steps.image.outputs.image }}'
          SOURCE_SHA='${{ steps.image.outputs.source_sha }}'
          gcloud run deploy "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --platform=managed \
            --image="$IMAGE" \
            --service-account="$RUNTIME_SA" \
            --allow-unauthenticated \
            --no-iap \
            --cpu=2 \
            --memory=3Gi \
            --timeout=900 \
            --concurrency=8 \
            --min-instances=0 \
            --max-instances=1 \
            --set-env-vars="NODE_ENV=production,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,VERTEX_LOCATION=$REGION,VEO_OUTPUT_BUCKET=$VEO_OUTPUT_BUCKET,FIRESTORE_DATABASE_ID=$FIRESTORE_DATABASE_ID,VEO_MODEL_ID=$VEO_MODEL_ID,IDENTITY_QA_MODEL=$IDENTITY_QA_MODEL,RUNTIME_SERVICE_ACCOUNT_EMAIL=$RUNTIME_SA,COMMIT_SHA=$SOURCE_SHA,FIRESTORE_DIAGNOSTIC_ENABLED=$FIRESTORE_DIAGNOSTIC_ENABLED,PUBLIC_PREVIEW_READ_ONLY=1,DIRECTOR_PRODUCTION_RUN_ENABLED=0,DIRECTOR_STORYBOARD_GEMINI_ENABLED=1,DIRECTOR_STORYBOARD_MODEL=$DIRECTOR_STORYBOARD_MODEL,DIRECTOR_STORYBOARD_LOCATION=$DIRECTOR_STORYBOARD_LOCATION,DIRECTOR_KEYFRAME_IMAGE_ENABLED=1,DIRECTOR_KEYFRAME_IMAGE_MODEL=$DIRECTOR_KEYFRAME_IMAGE_MODEL,DIRECTOR_KEYFRAME_IMAGE_LOCATION=$DIRECTOR_KEYFRAME_IMAGE_LOCATION,DIRECTOR_KEYFRAME_QA_ENABLED=0,DIRECTOR_KEYFRAME_QA_MODEL=$DIRECTOR_KEYFRAME_QA_MODEL,DIRECTOR_KEYFRAME_QA_LOCATION=$DIRECTOR_KEYFRAME_QA_LOCATION,P0_DISABLE_STARTUP_RECOVERY=1" \
            --quiet

          SERVICE_URL="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          REVISION="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.latestReadyRevisionName)')"
          echo "service_url=$SERVICE_URL" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Verify public React page, Director Cloud, and safe API
        shell: bash
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.service_url }}
        run: |
          set -euo pipefail
          ROOT_STATUS="$(curl -sS -o root.html -w '%{http_code}' "$SERVICE_URL/")"
          test "$ROOT_STATUS" = '200'
          grep -q 'id="root"' root.html

          curl -fsS "$SERVICE_URL/api/director/capabilities" | tee capabilities.json
          grep -q '"readOnlyPreview":true' capabilities.json
          grep -q '"productionRunEnabled":false' capabilities.json
          grep -q '"storyboardGeminiEnabled":true' capabilities.json
          grep -q '"storyboardModel":"gemini-2.5-flash"' capabilities.json
          grep -q '"keyframeImageEnabled":true' capabilities.json
          grep -q '"keyframeImageModel":"gemini-3.1-flash-image"' capabilities.json
          grep -q '"keyframeQaEnabled":false' capabilities.json

          FIRESTORE_STATUS="$(curl -sS -o firestore.json -w '%{http_code}' "$SERVICE_URL/api/debug/firestore")"
          test "$FIRESTORE_STATUS" = '200'
          jq -e --arg project "$PROJECT_ID" --arg database "$FIRESTORE_DATABASE_ID" --arg sa "$RUNTIME_SA" '
            .ok == true and
            .runtimeProjectId == $project and
            .firestoreDatabaseId == $database and
            .serviceAccount == $sa and
            .firestoreReachable == true and
            (.collections | index("director_projects")) != null
          ' firestore.json

          SERVICE_ACCOUNT="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(spec.template.spec.serviceAccountName)')"
          test "$SERVICE_ACCOUNT" = "$RUNTIME_SA"

          # Capture only Firestore-related Cloud Run log fields. This is a
          # read-only diagnostic and intentionally excludes request bodies and
          # credentials.
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="zaojing-director-console-uat" AND (textPayload:"Firestore" OR textPayload:"PERMISSION_DENIED" OR jsonPayload.message:"Firestore" OR jsonPayload.message:"PERMISSION_DENIED")' \
            --project="$PROJECT_ID" \
            --freshness=24h \
            --limit=100 \
            --format='table(timestamp,severity,textPayload,jsonPayload.message)' || true

          # Use an ID that is valid for Firestore document paths but is not a
          # real project. A 404 proves the runtime can read the database without
          # writing any project or production asset.
          SESSION_STATUS="$(curl -sS -o session.json -w '%{http_code}' "$SERVICE_URL/api/director/project-session/uat-firestore-diagnosis-missing-project-20260901")"
          test "$SESSION_STATUS" = '404'
          jq -e '.error == "DIRECTOR_PROJECT_NOT_FOUND"' session.json

          # Regression probe for the incident that caused the original 503:
          # an invalid/reserved document ID must not disable the shared
          # Firestore client for subsequent valid requests.
          RESERVED_STATUS="$(curl -sS -o reserved-session.json -w '%{http_code}' "$SERVICE_URL/api/director/project-session/__step_4_0_3_c_missing__")"
          test "$RESERVED_STATUS" != '503'
          POST_RESERVED_PERSIST_STATUS="$(curl -sS -o post-reserved-persistence.json -w '%{http_code}' "$SERVICE_URL/api/director/persistence/latest")"
          test "$POST_RESERVED_PERSIST_STATUS" = '200' -o "$POST_RESERVED_PERSIST_STATUS" = '404'

          PERSIST_STATUS="$(curl -sS -o persistence.json -w '%{http_code}' "$SERVICE_URL/api/director/persistence/latest")"
          test "$PERSIST_STATUS" = '200' -o "$PERSIST_STATUS" = '404'
          if [ "$PERSIST_STATUS" = '200' ]; then
            LIVE_PROJECT_ID="$(jq -r '.record.snapshot.projectId // empty' persistence.json)"
            LIVE_EPISODE_ID="$(jq -r '.record.snapshot.episodeId // empty' persistence.json)"
            test -n "$LIVE_PROJECT_ID"
            test -n "$LIVE_EPISODE_ID"
            LIVE_SESSION_STATUS="$(curl -sS -o live-session.json -w '%{http_code}' "$SERVICE_URL/api/director/project-session/$LIVE_PROJECT_ID?episodeId=$LIVE_EPISODE_ID")"
            test "$LIVE_SESSION_STATUS" = '200'
            jq -e --arg project "$LIVE_PROJECT_ID" --arg episode "$LIVE_EPISODE_ID" '
              .ok == true and
              .project.projectId == $project and
              .episode.episodeId == $episode and
              (.shots | type == "array") and
              (.assets | type == "array") and
              (.context.schema == "zaojing.director.context.v1")
            ' live-session.json
          fi

          curl -fsS "$SERVICE_URL/api/episodes?limit=1" | tee episodes.json
          grep -q '"ok":true' episodes.json

          # Read-only smoke only. Never write a Director project during deployment.
          # Intentionally do not call paid Director provider endpoints here.
          # Deployment smoke must never invoke Storyboard, Keyframe Image, Keyframe QA, or Veo.

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo '## Gemini Director UAT ready'
            echo ''
            echo "- Source commit: \`${{ steps.image.outputs.source_sha }}\`"
            echo "- Cloud Run service: \`$SERVICE\`"
            echo "- Revision: \`${{ steps.deploy.outputs.revision }}\`"
            echo "- Public URL: ${{ steps.deploy.outputs.service_url }}"
            echo "- Director persistence: Firestore \`$FIRESTORE_DATABASE_ID\` + GCS \`$VEO_OUTPUT_BUCKET\`"
            echo "- Firestore runtime IAM: \`roles/datastore.user\` for \`$RUNTIME_SA\` (pre-check: ${{ steps.firestore.outputs.runtime_datastore_role_before }}, final: ${{ steps.firestore.outputs.runtime_datastore_role }})"
            echo "- Storyboard provider: Vertex AI Gemini / \`$DIRECTOR_STORYBOARD_MODEL\`"
            echo "- Keyframe image provider: Vertex AI Gemini / \`$DIRECTOR_KEYFRAME_IMAGE_MODEL\`"
            echo '- Keyframe QA: disabled; current QA policy is human-only'
            echo '- Preview safety: Director metadata/assets persistence enabled; Episode/Veo production remains disabled'
            echo '- Deployment smoke is read-only and does not invoke paid Gemini/Veo endpoints'
          } >> "$GITHUB_STEP_SUMMARY"
