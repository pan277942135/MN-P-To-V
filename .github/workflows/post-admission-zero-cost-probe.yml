name: POST Admission Zero-Cost Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: xp-vertex-project
  REGION: us-central1
  SERVICE: zaojing-m2-uat
  WIF_PROVIDER: projects/89614354864/locations/global/workloadIdentityPools/github-actions-mnptov/providers/repo
  DIAG_SA: github-deployer@xp-vertex-project.iam.gserviceaccount.com

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DIAG_SA }}
          create_credentials_file: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Resolve UAT service
        id: service
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          REVISION="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.latestReadyRevisionName)')"
          echo "service_url=$SERVICE_URL" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "UAT revision: $REVISION"

      - name: Mint authenticated Cloud Run ID token
        uses: google-github-actions/auth@v3
        id: invoke_auth
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DIAG_SA }}
          token_format: id_token
          id_token_audience: ${{ steps.service.outputs.service_url }}
          id_token_include_email: true

      - name: Zero-cost POST admission probe
        id: post_probe
        shell: bash
        env:
          SERVICE_URL: ${{ steps.service.outputs.service_url }}
          ID_TOKEN: ${{ steps.invoke_auth.outputs.id_token }}
        run: |
          set -euo pipefail
          STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "started_at=$STARTED_AT" >> "$GITHUB_OUTPUT"
          CODE="$(curl -sS -o /tmp/post-body.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $ID_TOKEN" \
            -H 'x-connection-id: zero-cost-post-admission-probe' \
            -F 'rawUserPrompt=admission probe only; do not generate' \
            "$SERVICE_URL/api/videos/start" || true)"
          echo "http_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "POST /api/videos/start HTTP $CODE"
          echo 'Response body (truncated):'
          head -c 2000 /tmp/post-body.json || true
          echo

          # This request intentionally omits firstFrame/master evidence, so it must fail
          # before any provider/Veo submission. The only failure we are testing against
          # here is Cloud Run platform admission 429.
          if [ "$CODE" = "429" ]; then
            echo 'FAIL: Cloud Run admission still rejected POST /api/videos/start with HTTP 429.' >&2
            exit 1
          fi
          if ! [[ "$CODE" =~ ^(4|5)[0-9][0-9]$ ]]; then
            echo "FAIL: expected an application-layer rejection for deliberately incomplete input, got HTTP $CODE." >&2
            exit 1
          fi

      - name: Confirm POST in Cloud Run request log
        shell: bash
        env:
          PROBE_STARTED_AT: ${{ steps.post_probe.outputs.started_at }}
          EXPECTED_CODE: ${{ steps.post_probe.outputs.http_code }}
        run: |
          set -euo pipefail
          SINCE="$(date -u -d "$PROBE_STARTED_AT - 15 seconds" +%Y-%m-%dT%H:%M:%SZ)"
          LOGS=''
          for attempt in 1 2 3 4 5 6; do
            LOGS="$(gcloud logging read \
              "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"$SERVICE\" AND timestamp>=\"$SINCE\" AND httpRequest.requestMethod=\"POST\" AND httpRequest.requestUrl:\"/api/videos/start\"" \
              --project="$PROJECT_ID" \
              --bucket=_Default \
              --location=global \
              --view=_Default \
              --limit=20 \
              --order=desc \
              --format='value(timestamp,resource.labels.revision_name,httpRequest.status,httpRequest.latency,trace)')"
            if [ -n "$LOGS" ]; then
              break
            fi
            echo "Cloud Logging has not ingested the POST yet (attempt $attempt/6); retrying..."
            sleep 5
          done
          echo 'Matching Cloud Run request logs:'
          printf '%s\n' "$LOGS"
          test -n "$LOGS"
          LATEST_STATUS="$(printf '%s\n' "$LOGS" | head -n1 | awk '{print $3}')"
          if [ "$LATEST_STATUS" = "429" ]; then
            echo 'FAIL: newest matching Cloud Run request log is still HTTP 429.' >&2
            exit 1
          fi
          echo "PASS: POST reached Cloud Run application path; newest logged status=$LATEST_STATUS, probe response=$EXPECTED_CODE."

      - name: Publish probe summary
        shell: bash
        run: |
          echo '## Zero-cost POST admission probe passed' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "- revision: ${{ steps.service.outputs.revision }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- POST /api/videos/start response: HTTP ${{ steps.post_probe.outputs.http_code }}" >> "$GITHUB_STEP_SUMMARY"
          echo '- HTTP 429: not observed' >> "$GITHUB_STEP_SUMMARY"
          echo '- Veo/provider generation: not invoked by design (deliberately incomplete input)' >> "$GITHUB_STEP_SUMMARY"
