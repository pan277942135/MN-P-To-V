name: M2-5 Human Review

on:
  workflow_dispatch:
  push:
    branches:
      - m2-5-human-review-workbench
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  human-review:
    runs-on: ubuntu-latest
    env:
      VEO_OUTPUT_BUCKET: ai-studio-bucket-89614354864-asia-south1
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Human-review contract gate
        run: |
          test ! -e scripts/apply-m2-5-human-review.py
          test ! -e scripts/apply-m2-5-studio-polling.py
          grep -q "app.post('/api/videos/review/:taskId'" server.ts
          grep -q "resolveHumanReview" src/server/services/taskStateMachineService.ts
          grep -q "humanReviewValid" src/server/services/taskStateMachineService.ts
          grep -q "HUMAN_REVIEW_NOT_ELIGIBLE" src/server/services/taskStateMachineService.ts
          grep -q "HUMAN_REVIEW_DECISION_CONFLICT" src/server/services/taskStateMachineService.ts
          grep -q "statusData.status === 'qa_pending' && statusData.requiresManualApproval" src/pages/StudioPage.tsx
          grep -q "handleVideoHumanReview('accepted')" src/pages/StudioPage.tsx
          grep -q "handleVideoHumanReview('rejected')" src/pages/StudioPage.tsx
          grep -q "submission_outcome_unknown" src/pages/StudioPage.tsx
          grep -q "该状态不能通过“接受视频”解除" src/pages/StudioPage.tsx

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: TypeScript gate
        run: npm run lint

      - name: Full regression suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Diff integrity
        run: git diff --check
