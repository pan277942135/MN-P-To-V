name: M2-3 Failure Diagnosis

on:
  workflow_dispatch:
  push:
    branches:
      - m2-3-failure-diagnosis
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  failure-diagnosis:
    runs-on: ubuntu-latest
    env:
      VEO_OUTPUT_BUCKET: ai-studio-bucket-89614354864-asia-south1
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply M2-3 diagnosis integration
        run: python scripts/apply-m2-3-failure-diagnosis.py

      - name: Diagnosis contract gate
        run: |
          grep -q "VideoFailureDiagnosisService.diagnose(qaReport)" server.ts
          grep -q "VideoFailureDiagnosisService.diagnose(videoQaReport)" src/services/tasks/taskOrchestrator.ts
          grep -q "failureDiagnosis?.repairPromptAppend" src/services/tasks/taskOrchestrator.ts
          grep -q "IDENTITY_SWAP_OR_SEVERE_LOSS" src/services/qa/videoFailureDiagnosisService.ts
          grep -q "QA_EVIDENCE_INCOMPLETE" src/services/qa/videoFailureDiagnosisService.ts
          if grep -q "generateContent" src/services/qa/videoFailureDiagnosisService.ts; then
            echo 'Failure diagnosis must be deterministic and must not call a generative model.' >&2
            exit 1
          fi
          if grep -q "repairInstruction ||" src/services/tasks/taskOrchestrator.ts && ! grep -q "failureDiagnosis?.repairPromptAppend" src/services/tasks/taskOrchestrator.ts; then
            echo 'Directional repair is not diagnosis-first.' >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: TypeScript gate
        run: npm run lint

      - name: Full regression suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Diff integrity
        run: git diff --check

      - name: Commit diagnosis integration
        if: github.event_name == 'push'
        run: |
          if git diff --quiet; then
            echo 'Diagnosis integration already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts src/services/tasks/taskOrchestrator.ts
          git commit -m 'feat(m2-3): persist structured video failure diagnosis'
          git push origin HEAD:${GITHUB_REF_NAME}
