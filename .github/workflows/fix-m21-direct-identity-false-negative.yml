name: Fix M2-1 Direct Identity False Negative

on:
  push:
    branches:
      - fix-m21-direct-identity-false-negative

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      VEO_OUTPUT_BUCKET: ai-studio-bucket-89614354864-asia-south1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply direct identity hardening
        run: python3 scripts/apply-m21-direct-identity-false-negative-fix.py

      - name: Source contract gate
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'masterImageBuffers: masterBuffers' server.ts
          grep -Fq 'scenePreservationScore: 100' src/services/character/identityLockService.ts
          grep -Fq '...masterParts' src/services/qa/visualQaService.ts
          grep -Fq '(pipelineError as any).startData = startData' src/pages/StudioPage.tsx
          grep -Fq "failureReason === 'identity_qa_failed'" src/pages/TaskHistoryPage.tsx
          grep -Fq '(task as any).firstFrameQaReport' src/utils/taskHelper.ts
          if grep -Fq 'const masterBufForQa = masterBuffers[0]' server.ts; then
            echo 'Single-master QA wiring still present.' >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Focused M2-1 regression
        run: npx vitest run src/__tests__/m21DirectIdentityFalseNegativeHardening.test.ts src/__tests__/m21DirectIdentityEvidenceUxContract.test.ts src/__tests__/m21DirectIdentityQaRegression.test.ts src/__tests__/m21CharacterIdentityLock.test.ts src/__tests__/m2UatIdentityGateUx.test.ts

      - name: TypeScript gate
        run: npm run lint

      - name: Full regression suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Diff integrity
        run: git diff --check

      - name: Commit verified product fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts src/services/character/identityLockService.ts src/services/qa/visualQaService.ts src/pages/StudioPage.tsx src/pages/TaskHistoryPage.tsx src/utils/taskHelper.ts src/types/index.ts
          if git diff --cached --quiet; then
            echo 'No source patch to commit.'
            exit 0
          fi
          git commit -m 'fix: harden direct identity gate against false negatives'
          git push origin HEAD:fix-m21-direct-identity-false-negative
