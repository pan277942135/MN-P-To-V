name: M2-4 Automatic Retry Policy

on:
  workflow_dispatch:
  push:
    branches:
      - m2-4-automatic-retry-policy
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  automatic-retry:
    runs-on: ubuntu-latest
    env:
      VEO_OUTPUT_BUCKET: ai-studio-bucket-89614354864-asia-south1
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply M2-4 retry integration
        run: python scripts/apply-m2-4-retry-integration.py

      - name: Retry contract gate
        run: |
          grep -q "VideoRetryPolicyService.decide" server.ts
          grep -q "reserveAutomaticProviderRetry" server.ts
          grep -q "DurableVideoRetryService.launch" server.ts
          grep -q "providerAttempt: 1" server.ts
          grep -q "retrySubmissionState: 'reserved'" src/server/services/taskStateMachineService.ts
          grep -q "artifactHistory" src/server/services/taskStateMachineService.ts
          grep -q "task_a/attempts/2" src/__tests__/m24DurableRetryReservation.test.ts
          if grep -q "videoAttempts < maxVideoAttempts" src/services/tasks/taskOrchestrator.ts; then
            echo 'Blind provider retry loop remains in TaskOrchestrator.' >&2
            exit 1
          fi
          grep -q "retryDecision.action === 'REGENERATE_VIDEO'" src/services/tasks/taskOrchestrator.ts
          grep -q "QA_REVIEW_REQUIRES_HUMAN" src/services/qa/videoRetryPolicyService.ts
          grep -q "QA_EVIDENCE_INCOMPLETE_REQA" src/services/qa/videoRetryPolicyService.ts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: TypeScript gate
        run: npm run lint

      - name: Full regression suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Diff integrity
        run: git diff --check

      - name: Commit retry integration
        if: github.event_name == 'push'
        run: |
          if git diff --quiet; then
            echo 'Retry integration already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts src/types/index.ts src/server/services/taskStateMachineService.ts src/services/tasks/taskOrchestrator.ts
          git commit -m 'feat(m2-4): enforce durable automatic retry policy'
          git push origin HEAD:${GITHUB_REF_NAME}
