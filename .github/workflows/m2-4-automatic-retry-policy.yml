name: M2-4 Automatic Retry Policy

on:
  workflow_dispatch:
  push:
    branches:
      - m2-4-automatic-retry-policy
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  automatic-retry:
    runs-on: ubuntu-latest
    env:
      VEO_OUTPUT_BUCKET: ai-studio-bucket-89614354864-asia-south1
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Retry contract gate
        run: |
          test ! -e scripts/apply-m2-4-retry-integration.py
          test ! -e scripts/apply-m2-4-followup.py
          test ! -e scripts/apply-m2-4-postaudit.py
          grep -q "VideoRetryPolicyService.decide" server.ts
          grep -q "reserveAutomaticProviderRetry" server.ts
          grep -q "DurableVideoRetryService.launch" server.ts
          grep -q "providerAttempt: 1" server.ts
          grep -q "retrySubmissionState: 'reserved'" src/server/services/taskStateMachineService.ts
          grep -q "artifactHistory" src/server/services/taskStateMachineService.ts
          grep -q "task_a/attempts/2" src/__tests__/m24DurableRetryReservation.test.ts
          grep -q "submission_outcome_unknown'" server.ts
          grep -q "requiresManualReview: true" server.ts
          grep -q "retryHistoryForOutcome" server.ts
          grep -q "retryHistoryForQaError" server.ts
          grep -q "AUTOMATIC_RETRY_SUBMISSION_OUTCOME_UNKNOWN" src/__tests__/m24RetryOutcomeUnknown.test.ts
          if grep -q "videoAttempts < maxVideoAttempts" src/services/tasks/taskOrchestrator.ts; then
            echo 'Blind provider retry loop remains in TaskOrchestrator.' >&2
            exit 1
          fi
          grep -q "if (retryDecision.action === 'REGENERATE_VIDEO')" src/services/tasks/taskOrchestrator.ts
          grep -q "QA_REVIEW_REQUIRES_HUMAN" src/services/qa/videoRetryPolicyService.ts
          grep -q "QA_EVIDENCE_INCOMPLETE_REQA" src/services/qa/videoRetryPolicyService.ts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: TypeScript gate
        run: npm run lint

      - name: Full regression suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Diff integrity
        run: git diff --check
