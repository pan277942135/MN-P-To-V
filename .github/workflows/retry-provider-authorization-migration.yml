name: Retry Provider Authorization Cutover

on:
  push:
    branches:
      - core-retry-provider-authorization-boundary
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      VEO_OUTPUT_BUCKET: ai-studio-bucket-89614354864-asia-south1
      NODE_ENV: test
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: core-retry-provider-authorization-boundary
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Apply retry Provider authorization patch
        run: node scripts/apply_retry_provider_authorization_patch.mjs

      - name: TypeScript gate
        run: npm run lint

      - name: Full regression suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Diff integrity
        run: git diff --check

      - name: Persist verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            server.ts \
            src/types/index.ts \
            src/server/services/taskStateMachineService.ts \
            src/server/services/durableVideoRetryService.ts \
            src/__tests__/m24DurableRetryReservation.test.ts \
            src/__tests__/m24RetryOutcomeUnknown.test.ts \
            src/__tests__/retryProviderAuthorizationBoundarySourceContract.test.ts
          if git diff --cached --quiet; then
            echo "No product changes to persist"
          else
            git commit -m "feat: add durable Provider authorization boundary to automatic retry"
            git push origin HEAD:core-retry-provider-authorization-boundary
          fi
